                                        <h3 className="font-bold text-gray-800 flex items-center gap-2"><span className="text-lg">📉</span> Taxa de Acerto por Questão</h3>
                                        <div className="flex flex-wrap items-center gap-2 export-controls">
                                            <select 
                                                value={filtroAgrupamento} 
                                                onChange={(e) => setFiltroAgrupamento(e.target.value)}

                                                <button onClick={() => setOrdemCompEdicoes('decrescente')} className={`flex items-center gap-1 text-[10px] md:text-xs font-bold px-2 md:px-3 py-1.5 rounded transition-colors ${ordemCompEdicoes === 'decrescente' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>📈 Decrescente</button>

                                    {(() => {

                                                const recFormat = isAbs ? h.absRec : `${h.percRec.toFixed(1)}%`;

                                                                            {labelFormat}

                                                                    <div className="absolute top-full w-full flex items-center justify-center mt-1 h-10">
                                                                        <span className={`font-black ${textColorClass} whitespace-nowrap`} style={{ transform: 'rotate(-90deg)', fontSize: '10px' }}>
                                                                            {labelFormat}
                                                                        </span>
                                                                    </div>
                                                                </div>

                                                                        <span className="font-black text-gray-400 whitespace-nowrap" style={{ transform: 'rotate(-90deg)', fontSize: '10px' }}>
                                                                            0{isAbs ? '' : '%'}
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                            )}

                                                            <span className="text-[9px] md:text-xs text-gray-800 font-extrabold leading-tight">{h.habilidade}</span>
                                                        </div>
                                                    </div>
                                                )
                                            })}

                                                    </tr>

                                                        const valMid = isAbs ? (h.absMid !== null ? h.absMid : '-') : (h.percMid !== null ? `${h.percMid.toFixed(1)}%` : '-');
                                                        const valDelta = isAbs ? h.deltaAbs : h.delta;
                                                        const labelFormat = isAbs ? (valDelta > 0 ? `+${valDelta}` : valDelta) : `${valDelta > 0 ? '+' : ''}${valDelta.toFixed(1)}%`;
                                                        const activeColorClass = isAbs ? h.colorClassAbs : h.colorClassPerc;

                                                                <td data-t="n" data-v={valAnt} className="py-3 px-4 text-center font-bold text-gray-500">{valAnt}</td>

                                                                )}
                                                                <td data-t="n" data-v={valRec} className="py-3 px-4 text-center font-bold text-gray-800">{valRec}</td>
                                                                <td data-t="s" data-v={labelFormat} className="py-3 px-4 text-center">
                                                                    <span className={`${activeColorClass} text-white px-2 py-1.5 rounded shadow-sm font-extrabold text-xs block mx-auto w-20`}>
                                                                        {labelFormat}
                                                                    </span>
                                                                </td>
                                                            </tr>
                                                        )
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>

                                {/* CARD 2: Habilidades por Turma (Comparativo) */}
                                <div id="card-hab-turma" className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 relative">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                                        <h3 className="font-bold text-gray-800 flex items-center gap-2"><span className="text-lg">📊</span> Habilidades por Turma (Comparativo)</h3>

                                        </div>

                                        <div className="mb-6 w-full max-w-3xl mx-auto" data-html2canvas-ignore="true">

                                                <div className="flex bg-gray-100 rounded-md p-1 border border-gray-200">
                                                    <button onClick={() => setOrdemSelectDetalhe('alfabetica')} className={`flex items-center gap-1 text-[10px] md:text-xs font-bold px-2 py-1 rounded transition-colors ${ordemSelectDetalhe === 'alfabetica' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>A-Z</button>
                                                    <button onClick={() => setOrdemSelectDetalhe('crescente')} className={`flex items-center gap-1 text-[10px] md:text-xs font-bold px-2 py-1 rounded transition-colors ${ordemSelectDetalhe === 'crescente' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>📉 Cresc.</button>
                                                    <button onClick={() => setOrdemSelectDetalhe('decrescente')} className={`flex items-center gap-1 text-[10px] md:text-xs font-bold px-2 py-1 rounded transition-colors ${ordemSelectDetalhe === 'decrescente' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>📈 Decresc.</button>
                                                </div>
                                            </div>
                                            <select 
                                                className="w-full p-2.5 border border-gray-300 rounded-lg text-sm font-semibold text-gray-700 bg-gray-50 focus:ring-2 focus:ring-same-teal outline-none cursor-pointer"
                                                value={habSelecionada}
                                                onChange={(e) => setHabSelecionada(e.target.value)}
                                            >
                                                {optionsDetalhe.map(h => (
                                                    <option key={h.habilidade} value={h.habilidade}>{h.habilidade} - {h.descricao} ({h.percentual.toFixed(1)}%)</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="flex justify-center mb-6" data-html2canvas-ignore="true">
                                            <div className="flex bg-gray-100 rounded-md p-1 border border-gray-200">
                                                <button onClick={() => setViewDetalheHab('turma')} className={`flex items-center gap-2 text-xs font-bold px-4 py-2 rounded transition-colors ${viewDetalheHab === 'turma' ? 'bg-same-teal text-white shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>📊 Desempenho por Turma</button>
                                                <button onClick={() => setViewDetalheHab('questoes')} className={`flex items-center gap-2 text-xs font-bold px-4 py-2 rounded transition-colors ${viewDetalheHab === 'questoes' ? 'bg-same-teal text-white shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>📝 Acertos por Questão</button>

                                        <div className="border-t border-gray-100 pt-6">
                                            {viewDetalheHab === 'turma' ? (
                                                <div className="animate-fade-in max-w-3xl mx-auto">

                                                    <p className="text-xs text-gray-500 font-medium px-4 text-center mb-8">{detalheHab.descricao} ({detalheHab.percGeral.toFixed(1)}%)</p>

                                                    <div className="flex items-end justify-between h-72 border-b-2 border-l-2 border-gray-200 pt-10 px-1 md:px-4 relative w-full mb-8" style={{ minWidth: `${Math.max(250, (analiseHabilidades.turmasLista.length - hiddenTurmas.length) * 35)}px` }}>
                                                        <div className="absolute top-0 w-full border-t border-gray-100 left-0"></div>
                                                        <div className="absolute top-1/4 w-full border-t border-gray-100 left-0"></div>
                                                        <div className="absolute top-2/4 w-full border-t border-gray-100 left-0"></div>
                                                        <div className="absolute top-3/4 w-full border-t border-gray-100 left-0"></div>
                                                        
                                                        {detalheHab.classesOverall.map((co, i) => {
                                                                    if (hiddenTurmas.includes(co.turma)) return null;
                                                                    const originalIdx = analiseHabilidades.turmasLista.indexOf(co.turma);
                                                                    const color = COLORS_TURMAS[originalIdx % COLORS_TURMAS.length];
                                                                    return (
                                                                        <div key={co.turma} className="flex flex-col items-center flex-1 h-full justify-end group z-10 cursor-crosshair px-1">
                                                                            <div className="w-full max-w-[60px] min-w-[12px] rounded-t-sm shadow relative transition-all duration-300 hover:opacity-80" style={{height: `${Math.max(co.perc, 1)}%`, backgroundColor: color}} title={`${co.turma}: ${co.perc.toFixed(1)}%`}>
                                                                                <span className="absolute -top-7 left-1/2 -translate-x-1/2 text-[9px] md:text-xs font-black text-gray-700 whitespace-nowrap z-50 bg-white/50 px-1 rounded">{co.perc.toFixed(1)}%</span>
                                                                            </div>
                                                                            <span className="mt-4 text-[8px] md:text-[10px] font-bold text-gray-600 text-center w-full truncate" title={co.turma}>{co.turma}</span>
                                                                        </div>
                                                                    )
                                                        })}
                                                    </div>
                                                    
                                                    <LegendaInterativa 
                                                        turmas={analiseHabilidades.turmasLista} 
                                                        hiddenTurmas={hiddenTurmas} 
                                                        onToggle={toggleTurmaVisibility}

                                                                        <div className="absolute top-0 w-full border-t border-gray-100 left-0"></div>
                                                                        <div className="absolute top-1/4 w-full border-t border-gray-100 left-0"></div>
                                                                        <div className="absolute top-2/4 w-full border-t border-gray-100 left-0"></div>
                                                                        <div className="absolute top-3/4 w-full border-t border-gray-100 left-0"></div>
                                                                        
                                                                        {q.classScores.map((cs, i) => {
                                                                    if (hiddenTurmas.includes(cs.turma)) return null;
                                                                    const originalIdx = analiseHabilidades.turmasLista.indexOf(cs.turma);
                                                                    const color = COLORS_TURMAS[originalIdx % COLORS_TURMAS.length];
                                                                    return (
                                                                        <div key={cs.turma} className="flex-1 min-w-[8px] max-w-[32px] mx-[1px] rounded-t-sm relative group cursor-pointer z-10 transition-transform hover:-translate-y-1 shadow-sm" style={{height: `${Math.max(cs.perc, 1)}%`, backgroundColor: color}} title={`${cs.turma}: ${cs.perc.toFixed(1)}%\nDescrição: ${q.desc}`}>

                                                                                {cs.perc.toFixed(0)}%
                                                                            </span>
                                                                        </div>
                                                                    )
                                                                })}
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                    
                                                    <div className="mt-6 border-t border-gray-100 pt-4">
                                                        <LegendaInterativa 
                                                            turmas={analiseHabilidades.turmasLista} 
                                                            hiddenTurmas={hiddenTurmas} 
                                                            onToggle={toggleTurmaVisibility} 
                                                        />
                                                    </div>
                                                </div>
                                            )}
                                            
                                            <div className="mt-8 border-t border-gray-100 pt-4 avoid-break" style={{ pageBreakInside: 'avoid' }}>
                                                <p className="text-xs text-gray-500 font-medium text-center">

                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="flex flex-col gap-6 animate-fade-in">
                                {/* CARD SUPERIOR: Gráfico com Barra de Ferramentas de Filtros Completa */}
                                <div id="card-dificuldade-grafico" className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 relative">
                                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-6 gap-4">
                                        <div>
                                            <h3 className="font-bold text-gray-800 flex items-center gap-2">
                                                <span className="text-lg">📊</span> Questões por Nível de Dificuldade
                                            </h3>
                                            <p className="text-xs text-gray-400 mt-1 font-medium">Edição sob análise: <span className="font-bold text-gray-600">{stats.edicaoAtualStr}</span></p>
                                        </div>

                                        {/* Barra de Ferramentas Idêntica à Taxa de Acertos */}
                                        <div className="flex flex-wrap items-center gap-2 export-controls w-full lg:w-auto justify-end">
                                            <select 
                                                value={filtroDifGrupo} 
                                                onChange={(e) => setFiltroDifGrupo(e.target.value)}
                                                className="text-xs font-bold px-3 py-1.5 rounded border border-gray-200 text-gray-600 bg-white shadow-sm outline-none focus:border-same-teal cursor-pointer"
                                                data-html2canvas-ignore="true"
                                            >
                                                <option value="Todos">Todos os Níveis</option>
                                                <option value="Fáceis">Apenas Fáceis (15 +Acertadas)</option>
                                                <option value="Médias">Apenas Médias (15 Intermediárias)</option>
                                                <option value="Difíceis">Apenas Difíceis (15 -Acertadas)</option>
                                            </select>

                                            <div className="flex bg-gray-100 rounded-md p-1 border border-gray-200" data-html2canvas-ignore="true">

                                                <button onClick={() => setRotuloDifTaxa('percentual')} className={`flex items-center gap-1 text-[10px] md:text-xs font-bold px-2 md:px-3 py-1.5 rounded transition-colors ${rotuloDifTaxa === 'percentual' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>% Percentual</button>
                                            </div>

                                            <div className="flex bg-gray-100 rounded-md p-1 border border-gray-200" data-html2canvas-ignore="true">
                                                <button onClick={() => setOrdemDifTaxa('original')} className={`flex items-center gap-1 text-[10px] md:text-xs font-bold px-2 md:px-3 py-1.5 rounded transition-colors ${ordemDifTaxa === 'original' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>Por Item</button>
                                                <button onClick={() => setOrdemDifTaxa('habilidade')} className={`flex items-center gap-1 text-[10px] md:text-xs font-bold px-2 md:px-3 py-1.5 rounded transition-colors ${ordemDifTaxa === 'habilidade' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>Por Descritor</button>
                                                <button onClick={() => setOrdemDifTaxa('crescente')} className={`flex items-center gap-1 text-[10px] md:text-xs font-bold px-2 md:px-3 py-1.5 rounded transition-colors ${ordemDifTaxa === 'crescente' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>📉 Cresc.</button>
                                                <button onClick={() => setOrdemDifTaxa('decrescente')} className={`flex items-center gap-1 text-[10px] md:text-xs font-bold px-2 md:px-3 py-1.5 rounded transition-colors ${ordemDifTaxa === 'decrescente' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>📈 Decresc.</button>
                                            </div>

                                            <div className="flex bg-gray-100 rounded-md p-1 border border-gray-200" data-html2canvas-ignore="true">
                                                <button onClick={() => setViewDifTaxa('grafico')} className={`flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded transition-colors ${viewDifTaxa === 'grafico' ? 'bg-same-teal text-white shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}><IconBarChart/> Gráfico</button>
                                                <button onClick={() => setViewDifTaxa('tabela')} className={`flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded transition-colors ${viewDifTaxa === 'tabela' ? 'bg-same-teal text-white shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}><IconTable/> Tabela</button>
                                            </div>
                                            <ExportMenu viewType={viewDifTaxa} onExport={(format) => handleExport('card-dificuldade-grafico', viewDifTaxa, format, 'analise_dificuldade_itens')} />
                                        </div>
                                    </div>

                                    {/* Exibição Condicional: Modo Gráfico ou Modo Tabela */}
                                    {analiseDificuldade.questoesFiltradasExibição.length === 0 ? (
                                        <div className="h-72 flex items-center justify-center text-gray-400 font-medium text-sm border border-dashed border-gray-300 rounded-lg bg-gray-50">
                                            Nenhum item localizado para a configuração selecionada.
                                        </div>
                                    ) : viewDifTaxa === 'grafico' ? (
                                        <div className="h-[340px] flex items-end gap-px md:gap-1 px-1 md:px-2 pt-16 border-b-2 border-l-2 border-gray-200 relative mb-16 mt-8 w-full overflow-visible">
                                            <div className="absolute top-0 w-full border-t border-gray-100 left-0"></div>
                                            <div className="absolute top-1/4 w-full border-t border-gray-100 left-0"></div>
                                            <div className="absolute top-2/4 w-full border-t border-gray-100 left-0"></div>
                                            <div className="absolute top-3/4 w-full border-t border-gray-100 left-0"></div>

                                            {analiseDificuldade.questoesFiltradasExibição.map((q) => (
                                                <div key={q.id} className="flex flex-col items-center flex-1 h-full justify-end relative z-0 group cursor-crosshair" title={`Questão ${q.label} (${q.habilidade})\nTaxa de Acerto: ${q.percentual.toFixed(1)}%\nNível: ${q.agrupamento}`}>
                                                    <div className="relative w-full max-w-[40px] flex flex-col items-center justify-end h-full" style={{ height: `${Math.max(q.percentual * 0.8, 1)}%` }}>
                                                        <div className="absolute bottom-full w-full flex items-center justify-center mb-1 h-10">
                                                            <span className="font-black text-gray-700 whitespace-nowrap" style={{ transform: 'rotate(-90deg)', fontSize: '10px' }}>
                                                                {rotuloDifTaxa === 'absoluto' ? q.acertos : `${q.percentual.toFixed(1)}%`}
                                                            </span>
                                                        </div>
                                                        <div className={`w-full h-full ${q.colorClass} rounded-t-sm transition-all duration-500 z-10 hover:opacity-80`}></div>
                                                    </div>
                                                    <div className="absolute -bottom-12 w-full flex flex-col items-center justify-center">
                                                        <span className="text-[8px] md:text-[10px] text-gray-800 font-extrabold leading-tight">{q.label}</span>
                                                        <span className="text-[7px] md:text-[9px] text-gray-600 font-bold leading-tight">{q.habilidade}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="overflow-x-auto border border-gray-200 rounded-lg animate-fade-in avoid-break">
                                            <table className="min-w-full text-sm text-left border-collapse">

                                                    <tr className="bg-same-teal text-white">
                                                        <th className="py-3 px-4 font-bold">Item</th>
                                                        <th className="py-3 px-4 font-bold">Descritor</th>
                                                        <th className="py-3 px-4 font-bold">Habilidade Técnica</th>
                                                        <th className="py-3 px-4 font-bold text-center">Nível de Complexidade</th>
                                                        <th className="py-3 px-4 font-bold text-center">Taxa de Acerto</th>
                                                        <th className="py-3 px-4 font-bold text-center">Volume Acertos</th>
                                                    </tr>
                                                </thead>

                                                            <td className="py-3 px-4 font-extrabold text-gray-800">{q.label}</td>
                                                            <td className="py-3 px-4 text-blue-600 font-bold">{q.habilidade}</td>
                                                            <td className="py-3 px-4 text-xs text-gray-600 font-medium">{q.descricao}</td>
                                                            <td className="py-3 px-4 text-center font-bold text-xs"><span className={`px-2 py-0.5 rounded text-white ${q.colorClass}`}>{q.agrupamento}</span></td>
                                                            <td className="py-3 px-4 text-center">
                                                                <span className={`${q.colorClass} text-white px-2 py-1 rounded shadow-sm font-extrabold text-xs`}>
                                                                    {q.percentual.toFixed(2)}%
                                                                </span>
                                                            </td>
                                                            <td className="py-3 px-4 text-center font-bold">{q.acertos}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}

                                    {/* Bloco Dinâmico de Médias por Conjunto */}
                                    {analiseDificuldade.dadosPorEdicao[stats.edicaoAtualStr] && (
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-gray-50 p-4 rounded-xl border border-gray-100 mt-8">
                                            {analiseDificuldade.dadosPorEdicao[stats.edicaoAtualStr].resumoAcertos.map(g => (
                                                <div key={g.label} className="text-center flex flex-col justify-center py-2 border-r border-gray-200 last:border-r-0">
                                                    <span className="text-xs font-bold text-gray-400 uppercase tracking-wider">{g.icon} Bloco de Itens {g.label}</span>
                                                    <h4 className="text-2xl font-black text-gray-800 mt-1">{g.percentual.toFixed(1)}% <span className="text-xs font-medium text-gray-400 block md:inline">de acerto médio</span></h4>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="flex flex-col gap-6 mt-2">
                                    {/* Seletor Simplificado de Habilidade com Descrição Completa */}
                                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center bg-white p-4 rounded-xl border border-gray-200 shadow-sm gap-4">

                                        <div className="w-full lg:flex-1 lg:max-w-2xl">
                                            <select 
                                                className="w-full p-2 border border-gray-300 rounded-lg text-xs font-semibold text-gray-700 bg-white focus:ring-2 focus:ring-same-teal outline-none cursor-pointer"
                                                value={filtroHabMatriz}
                                                onChange={(e) => setFiltroHabMatriz(e.target.value)}
                                            >
                                                <option value="Todas">Exibir Todos os Descritores</option>

                                                    <option key={h.habilidade} value={h.habilidade}>
                                                        {h.habilidade} - {h.descricao} ({h.percentualMédi.toFixed(0)}%)
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    {/* Listas de Exercícios Alinhadas Verticalmente por Edição */}
                                    {Object.keys(analiseDificuldade.dadosPorEdicao).map(edKey => {
                                        const edData = analiseDificuldade.dadosPorEdicao[edKey];
                                        const possuiItensFiltrados = edData.resumoAcertos.some(g => 
                                            g.questoes.some(q => filtroHabMatriz === 'Todas' || q.habilidade === filtroHabMatriz)
                                        );

                                        if (!possuiItensFiltrados) return null;

                                        return (
                                            <div key={edKey} className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-4">
                                                <div className="flex items-center justify-between border-b border-gray-100 pb-3">
                                                    <h4 className="text-sm font-black text-same-teal uppercase tracking-wide flex items-center gap-2">
                                                        🎯 Matriz Temática de Complexidade — Edição {edKey}
                                                    </h4>
                                                </div>

                                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-2">
                                                    {edData.resumoAcertos.map(grupo => {
                                                        const itensExibicao = grupo.questoes.filter(q => filtroHabMatriz === 'Todas' || q.habilidade === filtroHabMatriz);
                                                        if (itensExibicao.length === 0) return null;

                                                        return (
                                                            <div key={grupo.label} className="border border-gray-100 rounded-xl overflow-hidden flex flex-col bg-white shadow-sm h-[480px]">
                                                                <div className={`${grupo.color} p-3 text-white text-center font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-1.5`}>
                                                                    {grupo.icon} {grupo.label}
                                                                </div>
                                                                <div className="p-3 flex flex-col gap-3 overflow-y-auto h-full custom-scrollbar bg-gray-50/40">
                                                                    {itensExibicao.map(q => (
                                                                        <div key={q.id} className="bg-white p-3 rounded-xl border border-gray-100 shadow-sm flex flex-col gap-2 hover:border-gray-300 hover:shadow transition-all">

                                                {/* Bloco Indicador de Variação Longitudinal */}
                                                <div className="text-center flex flex-col items-center justify-center p-2">
                                                    <span className="text-xs font-black text-gray-400 uppercase tracking-widest block mb-1">Evolução Líquida</span>
                                                    <div className={`text-3xl font-black ${variacaoTri >= 0 ? 'text-green-600' : 'text-red-500'}`}>
                                                        {variacaoTri >= 0 ? `+${variacaoTri.toFixed(2)}` : variacaoTri.toFixed(2)}
                                                    </div>
                                                    <span className={`text-[11px] font-extrabold px-3 py-1 rounded-full mt-2 ${variacaoTri >= 0 ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'}`}>
                                                        {variacaoTri >= 0 ? '🚀 Crescimento' : '⚠️ Regressão'}
                                                    </span>
                                                </div>

                                                {/* Bloco Edição 2 */}
                                                <div className="p-4 border rounded-xl bg-white shadow-sm text-center">
                                                    <span className="bg-same-teal text-white px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider shadow-sm">{edicaoComp2_AbaSpaece} EDIÇÃO</span>
                                                    <div className="text-2xl font-black text-gray-800 mt-3">{dadosEd2.proficiencia.toFixed(2)}</div>
                                                    <div className="text-xs font-bold text-gray-400 mt-0.5">Proficiência Calculada</div>
                                                    <div className={`mt-3 py-1 text-[10px] font-black uppercase tracking-wider rounded-md ${dadosEd2.corClasse}`}>{dadosEd2.padrao}</div>
                                                    <div className="text-[11px] font-bold text-gray-500 mt-2">Resultado: {dadosEd2.acertos}/45 acertos</div>
                                                </div>
                                            </div>
                                        );
                                    })()}
                                </div>
                            </div>
                        ) : (
                            <div className="flex flex-col items-center justify-center h-64 bg-white rounded-xl shadow-sm border border-gray-100">
                                <IconWrench />
                                <h2 className="text-xl font-bold text-gray-600 mt-4">Filtro sem Parâmetros</h2>
                                <p className="text-gray-400 mt-2 text-sm font-medium">A guia <strong className="font-bold">{abaAtiva}</strong> não pode trazer relatórios para esse filtro selecionado.</p>
                            </div>
                        )}
                    </main>

                    {/* MODAL: FICHA DE DESEMPENHO INDIVIDUAL DO ESTUDANTE */}
                    {modalDetalheEstudante_AbaEst.open && modalDetalheEstudante_AbaEst.dadosAluno && (() => {
                        const alunoSel = modalDetalheEstudante_AbaEst.dadosAluno;
                        return (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-[99998] p-2 md:p-4" style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0 }}>
                                <div className="bg-white rounded-2xl w-[98vw] md:w-[95vw] max-w-6xl h-[92vh] flex flex-col overflow-hidden shadow-2xl animate-scale-up border border-gray-200 relative">
                                    
                                    <div className="bg-same-teal text-white px-6 py-4 flex justify-between items-center border-b border-teal-800" data-html2canvas-ignore="true">
                                        <div>
                                            <h4 className="font-black text-lg tracking-wide uppercase">Ficha de Desempenho: {alunoSel.nome}</h4>
                                        </div>
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => handleExport('ficha-estudante-pdf', 'cards', 'pdf', `Ficha_Desempenho_${alunoSel.nome.replace(/\s+/g, '_')}`)}
                                                className="bg-white text-same-teal font-black text-xs px-3 py-2 rounded-lg hover:bg-teal-50 transition-all shadow cursor-pointer"
                                            >
                                                📄 PDF (Retrato)
                                            </button>
                                            <button 
                                                onClick={() => handleExport('ficha-estudante-pdf', 'cards', 'pdf_landscape', `Ficha_Desempenho_Paisagem_${alunoSel.nome.replace(/\s+/g, '_')}`)}
                                                className="bg-teal-900 text-white font-black text-xs px-3 py-2 rounded-lg hover:bg-teal-700 transition-all shadow cursor-pointer border border-teal-700"
                                            >
                                                📄 PDF (Paisagem)
                                            </button>
                                            <button 
                                                onClick={() => setModalDetalheEstudante_AbaEst({ open: false, dadosAluno: null })}
                                                className="bg-red-500 hover:bg-red-600 text-white font-black text-xs px-4 py-2 rounded-lg transition-all shadow cursor-pointer"
                                            >
                                                ✕ Fechar
                                            </button>
                                        </div>
                                    </div>

                                    <div className="flex-1 overflow-y-auto custom-scrollbar bg-gray-50">
                                        {/* CONTAINER PARA EXPORTAÇÃO PDF */}
                                        <div id="ficha-estudante-pdf" className="p-4 md:p-6 bg-white max-w-5xl mx-auto my-2 shadow-sm rounded-xl">
                                            
                                            {/* Cabeçalho do PDF */}
                                            <div className="text-center border-b-2 border-gray-200 pb-4 mb-4">
                                                <h2 className="text-2xl font-black uppercase text-gray-800">Ficha de Desempenho Individual - SAME</h2>
                                                <h3 className="text-xl font-bold text-same-teal mt-1">{alunoSel.nome}</h3>
                                                <p className="text-sm font-bold text-gray-500">{alunoSel.etapa} - {alunoSel.turma} ({alunoSel.turno || '-'}) • {alunoSel.curso || 'Sem Curso'}</p>
                                                <p className="text-xs font-bold text-gray-400 mt-1">Média Percentual Acumulada: {alunoSel.mediaPercentual.toFixed(1)}%</p>
                                            </div>

                                            {/* Gabaritos por Edição com Habilidades Interativas */}
                                            <div className="mb-4">
                                                <h5 className="font-black text-gray-800 text-sm mb-3 border-b pb-2">📊 Análise de Acertos e Habilidades por Item</h5>
                                                <div className="flex flex-col gap-3">
                                                    {alunoSel.historicoEdicoes.map((ed, idxEd) => {
                                                        const gabaritoEd = dbSettings.gabaritos[ed.edicao]?.[disciplinaAtiva] || [];
                                                        const matrizEd = dbSettings.matrizes[ed.edicao]?.[disciplinaAtiva] || [];
                                                        
                                                        return (
                                                            <div key={idxEd} className="border border-gray-200 rounded-lg p-3 bg-gray-50">
                                                                <div className="flex justify-between items-center mb-3">
                                                                    <span className="font-extrabold text-xs text-same-teal uppercase tracking-wider">{ed.edicao} EDIÇÃO ({disciplinaAtiva})</span>
                                                                    <span className="text-xs font-black text-gray-700 bg-white border border-gray-200 px-3 py-1 rounded shadow-sm">Resultado: {ed.acertosTotal}/45 ({ed.percentual.toFixed(1)}%)</span>
                                                                </div>
                                                                <div className="grid grid-cols-5 sm:grid-cols-9 lg:grid-cols-15 gap-1.5">
                                                                    {gabaritoEd.map((correta, qIdx) => {
                                                                        const marcada = ed.respostasString?.[qIdx] || '-';
                                                                        const isCorreta = String(marcada).toUpperCase() === String(correta).toUpperCase();
                                                                        const habCode = matrizEd[qIdx] || '-';
                                                                        const habDesc = dbSettings.habilidades[disciplinaAtiva]?.[habCode] || 'Sem descrição cadastrada';
                                                                        
                                                                        return (
                                                                            <div 
                                                                                key={qIdx} 
                                                                                onClick={() => abrirQuestaoEstudante_AbaEst(ed.edicao, qIdx)}
                                                                                className={`p-1.5 rounded border transition-all flex flex-col justify-center items-center shadow-sm cursor-pointer hover:shadow-md hover:-translate-y-0.5 group relative ${isCorreta ? 'bg-green-50 border-green-200 text-green-700' : 'bg-red-50 border-red-200 text-red-700'}`}
                                                                                title={`Habilidade ${habCode}: ${habDesc}\nSua Resposta: ${marcada} | Gabarito: ${correta}\nClique para visualizar a questão.`}
                                                                            >
                                                                                <span className="text-[10px] font-black tracking-tighter">{habCode}</span>
                                                                                <div className="flex items-center gap-1 mt-0.5">
                                                                                    <span className="text-[9px] font-bold opacity-70">Q{String(qIdx + 1).padStart(2, '0')}</span>
                                                                                    <span className="text-xs font-black">{marcada}</span>
                                                                                </div>
                                                                            </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>

                                            {/* Análise de Habilidades - Top 10 */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 break-inside-avoid" style={{ pageBreakInside: 'avoid' }}>
                                                <div>
                                                    <h5 className="font-black text-green-700 text-sm mb-3 border-b pb-2">📈 Habilidades de Maior Domínio</h5>
                                                    <div className="flex flex-col gap-2.5">
                                                        {alunoSel.topHabilidadesAcertos.map((hab, hIdx) => (
                                                            <div key={hIdx} className="text-xs bg-green-50 p-2.5 rounded-lg border border-green-100">
                                                                <div className="flex justify-between font-bold text-gray-800 mb-1">
                                                                    <span className="text-green-700 font-extrabold">{hab.habilidade}</span>
                                                                    <span>{hab.acertos}/{hab.total} ({hab.percentualSucesso.toFixed(0)}%)</span>
                                                                </div>
                                                                <p className="text-[11px] text-gray-600 font-medium leading-tight mb-2">{hab.descricao}</p>
                                                                <div className="w-full bg-green-200/50 h-1.5 rounded-full overflow-hidden">
                                                                    <div className="bg-green-500 h-full rounded-full" style={{ width: `${hab.percentualSucesso}%` }}></div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                        {alunoSel.topHabilidadesAcertos.length === 0 && <p className="text-gray-400 text-xs py-2 font-bold">Sem dados.</p>}
                                                    </div>
                                                </div>

                                                <div>
                                                    <h5 className="font-black text-red-700 text-sm mb-3 border-b pb-2">📉 Habilidades com Necessidade de Foco</h5>
                                                    <div className="flex flex-col gap-2.5">
                                                        {alunoSel.topHabilidadesErros.map((hab, hIdx) => (
                                                            <div key={hIdx} className="text-xs bg-red-50 p-2.5 rounded-lg border border-red-100">
                                                                <div className="flex justify-between font-bold text-gray-800 mb-1">
                                                                    <span className="text-red-700 font-extrabold">{hab.habilidade}</span>
                                                                    <span>{hab.acertos}/{hab.total} ({hab.percentualSucesso.toFixed(0)}%)</span>
                                                                </div>
                                                                <p className="text-[11px] text-gray-600 font-medium leading-tight mb-2">{hab.descricao}</p>
                                                                <div className="w-full bg-red-200/50 h-1.5 rounded-full overflow-hidden">
                                                                    <div className="bg-red-500 h-full rounded-full" style={{ width: `${hab.percentualSucesso}%` }}></div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                        {alunoSel.topHabilidadesErros.length === 0 && <p className="text-gray-400 text-xs py-2 font-bold">Sem dados.</p>}
                                                    </div>
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* NOVA INTERFACE MODAL: Expandida e Sobrepondo Tudo */}
                        {modalPreview.open && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-[99999] p-2 md:p-6 animate-fade-in" style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0 }}>
                                <div className="bg-white rounded-2xl w-[98vw] max-w-none h-[95vh] flex flex-col overflow-hidden shadow-2xl relative">
                                    {/* Cabeçalho Atualizado da Janela Modal */}
                                <div className="bg-gray-950 text-white px-6 py-3 flex justify-between items-center border-b border-gray-800">
                                    <div className="flex flex-col gap-1 min-w-0 flex-1 pr-4">
                                        <h5 className="font-bold text-sm tracking-wide uppercase truncate">{modalPreview.title}</h5>
                                        {modalPreview.habilidade && (
                                            <p className="text-xs text-gray-400 font-medium truncate">
                                                <span className="text-same-teal font-bold">{modalPreview.habilidade}</span> — {modalPreview.descricao}
                                            </p>
                                        )}
                                    </div>
                                    
                                    <button 
                                        onClick={() => setModalPreview({ open: false, title: '', itemUrl: null, gabaritoUrl: null, activeType: 'item', habilidade: '', descricao: '' })}
                                        className="bg-red-600 hover:bg-red-700 text-white font-extrabold text-xs px-4 py-2 rounded-lg transition-colors flex-shrink-0 cursor-pointer z-50 relative"
                                    >
                                        ✕ Fechar
                                    </button>
                                </div>

                                    {/* Alternância de Abas (Item / Gabarito) */}
                                    <div className="bg-gray-100 p-3 flex justify-center gap-4 border-b border-gray-200">
                                        <button 
                                            onClick={() => setModalPreview(prev => ({ ...prev, activeType: 'item' }))}
                                            disabled={!modalPreview.itemUrl}
                                            className={`px-8 py-2 text-sm font-bold rounded-lg border transition-all ${modalPreview.activeType === 'item' ? 'bg-same-teal text-white shadow-md border-same-teal' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50 disabled:opacity-40'}`}
                                        >
                                            📄 Enunciado do Item
                                        </button>
                                        <button 
                                            onClick={() => setModalPreview(prev => ({ ...prev, activeType: 'gabarito' }))}
                                            disabled={!modalPreview.gabaritoUrl}
                                            className={`px-8 py-2 text-sm font-bold rounded-lg border transition-all ${modalPreview.activeType === 'gabarito' ? 'bg-same-orange text-white shadow-md border-same-orange' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50 disabled:opacity-40'}`}
                                        >
                                            🔑 Resolução Comentada
                                        </button>
                                    </div>

                                    {/* Área de Visualização com Ajuste de Largura e Rolagem Vertical */}
                                    <div className="flex-1 bg-gray-900 p-4 md:p-8 overflow-y-auto custom-scrollbar flex flex-col justify-start items-center">
                                        {modalPreview.activeType === 'item' && modalPreview.itemUrl && (
                                            <img 
                                                src={modalPreview.itemUrl} 
                                                alt="Visualização do Item" 
                                                className="w-full h-auto lg:w-4/5 rounded-xl shadow-2xl bg-white mb-8 mt-2"
                                            />
                                        )}
                                        {modalPreview.activeType === 'gabarito' && modalPreview.gabaritoUrl && (
                                            <img 
                                                src={modalPreview.gabaritoUrl} 
                                                alt="Visualização do Gabarito" 
                                                className="w-full h-auto lg:w-4/5 rounded-xl shadow-2xl bg-white mb-8 mt-2"
                                            />
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MODAL DETALHAMENTO DE ESTUDANTES (PARA A GUIA DISTRIBUIÇÕES) */}
                    {modalEstudantes.open && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-[99999] p-2 md:p-6 animate-fade-in" style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0 }}>
                            <div className="bg-white rounded-2xl w-[98vw] md:w-[90vw] max-w-5xl h-[90vh] flex flex-col overflow-hidden shadow-2xl relative" id="modal-export-estudantes">
                                
                                <div className="bg-same-teal text-white px-6 py-4 flex justify-between items-center border-b border-teal-800" data-html2canvas-ignore="true">
                                    <div>
                                        <h5 className="font-extrabold text-lg tracking-wide uppercase truncate">{modalEstudantes.title}</h5>
                                        <p className="text-sm text-teal-100 font-medium">{modalEstudantes.estudantes.length} estudante(s) neste filtro</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => handleExport('modal-export-estudantes', 'tabela', 'pdf_landscape', 'lista_estudantes')} className="bg-white text-same-teal hover:bg-teal-50 font-extrabold text-xs px-4 py-2 rounded-lg transition-colors shadow-sm cursor-pointer">
                                            ⬇ Baixar PDF
                                        </button>
                                        <button onClick={() => setModalEstudantes({ open: false, title: '', estudantes: [] })} className="bg-red-500 hover:bg-red-600 text-white font-extrabold text-xs px-4 py-2 rounded-lg transition-colors cursor-pointer">
                                            ✕ Fechar
                                        </button>
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto custom-scrollbar p-6 bg-gray-50">
                                    <div className="overflow-x-auto border border-gray-200 rounded-xl bg-white shadow-sm">
                                        <table className="min-w-full text-sm text-left border-collapse">
                                            <thead>
                                                <tr className="bg-gray-100 text-gray-700">
                                                    <th className="py-3 px-4 font-bold border-b">Nome do Estudante</th>
                                                    <th className="py-3 px-4 font-bold border-b">Etapa</th>
                                                    <th className="py-3 px-4 font-bold border-b">Turma</th>
                                                    <th className="py-3 px-4 font-bold border-b">Curso</th>
                                                    <th className="py-3 px-4 font-bold border-b text-center">Sexo</th>
                                                    <th className="py-3 px-4 font-bold border-b text-center">Idade</th>
                                                    <th className="py-3 px-4 font-bold border-b text-center">Taxa Acertos</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {modalEstudantes.estudantes.map((est, i) => {
                                                    let cClass = est.percentual <= 40 ? 'bg-red-500' : est.percentual <= 60 ? 'bg-orange-500' : est.percentual <= 80 ? 'bg-green-500' : 'bg-blue-500';
                                                    return (
                                                        <tr key={i} className="hover:bg-gray-50 avoid-break" style={{ pageBreakInside: 'avoid' }}>
                                                            <td className="py-2.5 px-4 font-extrabold text-gray-800 uppercase">{est.nome || 'NÃO IDENTIFICADO'}</td>
                                                            <td className="py-2.5 px-4 font-medium text-gray-600">{est.etapa}</td>
                                                            <td className="py-2.5 px-4 font-bold text-gray-700">{est.turma}</td>
                                                            <td className="py-2.5 px-4 text-xs font-medium text-gray-500">{est.curso}</td>
                                                            <td className="py-2.5 px-4 text-center font-medium text-gray-600">{est.sexo}</td>
                                                            <td className="py-2.5 px-4 text-center font-medium text-gray-600">{est.idade}</td>
                                                            <td className="py-2.5 px-4 text-center">
                                                                <span className={`${cClass} text-white px-2 py-1.5 rounded shadow-sm font-extrabold text-xs block mx-auto w-16`}>
                                                                    {est.percentual.toFixed(1)}%
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    )
                                                })}
                                            </tbody>
                                        </table>
                                        {modalEstudantes.estudantes.length === 0 && (
                                            <p className="text-center p-6 text-gray-400 font-bold">Nenhum estudante neste filtro.</p>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
