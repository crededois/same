                    const edicoes = stats.edicoesPresentes;
                    const ultEd = edicoes[edicoes.length - 1];
                    const valUlt = stats.statsPorEdicao[ultEd][field];
                    return (
                        <div className={`bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-center border-l-4 ${bgClass}`}>
                            <h3 className="text-3xl font-black text-gray-800">{valUlt}{suffix}</h3>
                            <p className="text-sm text-gray-500 font-medium mt-1 mb-2">{title} ({ultEd})</p>
                            <div className="flex flex-wrap gap-1 text-[10px] font-bold">
                                {edicoes.slice(0, -1).map(ed => (
                                    <span key={ed} className="bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded">{ed.substring(0,3)}: {stats.statsPorEdicao[ed][field]}{suffix}</span>
                                ))}
                            </div>
                        </div>
                    );
                }
            };

            const handleExport = async (elementId, viewType, formatType, filename) => {
                const originalElement = document.getElementById(elementId);
                if (!originalElement) return;

                if (formatType === 'excel') {
                    if (!window.XLSX) {
                        alert('Biblioteca XLSX não carregada.');
                        return;
                    }
                    const tables = originalElement.querySelectorAll('table');
                    if (tables.length > 0) {
                        const wb = window.XLSX.utils.book_new();
                        tables.forEach((table, idx) => {
                            const ws = window.XLSX.utils.table_to_sheet(table);
                            window.XLSX.utils.book_append_sheet(wb, ws, `Dados_${idx + 1}`);
                        });
                        window.XLSX.writeFile(wb, `${filename}.xlsx`);
                    } else {
                        alert("Tabela não encontrada para exportação.");
                    }
                    return;
                }

                if (!window.html2canvas && formatType === 'png') {
                    alert('Biblioteca html2canvas não carregada.');
                    return;
                }
                if (!window.html2pdf && formatType.startsWith('pdf')) {
                    alert('Biblioteca html2pdf não carregada.');
                    return;
                }

                const exportWidth = '100%'; 
                
                const wrapper = document.createElement('div');
                wrapper.style.position = 'absolute';
                wrapper.style.top = '0';
                wrapper.style.left = '-9999px'; 
                wrapper.style.width = '100%';
                wrapper.style.height = 'auto';
                wrapper.style.backgroundColor = '#ffffff';
                wrapper.style.zIndex = '-9999';
                
                const clone = originalElement.cloneNode(true);
                clone.className = 'bg-white p-6 relative';
                clone.style.width = '100%';
                clone.style.height = 'auto';
                clone.style.margin = '0';
                clone.style.boxShadow = 'none';
                clone.style.overflow = 'visible';
                
                wrapper.appendChild(clone);
                document.body.appendChild(wrapper);

                if (viewType === 'tabela') {
                    const tableContainers = clone.querySelectorAll('.overflow-x-auto');
                    tableContainers.forEach(c => {
                        c.classList.remove('overflow-x-auto');
                        c.style.overflow = 'visible';
                        c.style.height = 'auto';
                    });

                    // ADICIONE ESTAS LINHAS AQUI (Limpa o scroll vertical das janelas modais):
                    const modalContainers = clone.querySelectorAll('.overflow-y-auto');
                    modalContainers.forEach(c => {
                        c.classList.remove('overflow-y-auto');
                        c.style.overflow = 'visible';
                        c.style.height = 'auto';
                        c.style.maxHeight = 'none';
                    });

                    const tables = clone.querySelectorAll('table');
                    tables.forEach(t => {
                        t.style.width = '100%';
                        t.style.tableLayout = 'auto'; 
                    });
                } else if (viewType === 'grafico_linha') {

                    const tables = clone.querySelectorAll('table');
                    tables.forEach(t => {
                        t.style.width = '100%';
                        t.style.tableLayout = 'auto'; 
                    });
                } else if (viewType === 'grafico_linha') {
                    const svgContainers = clone.querySelectorAll('.svg-chart-container');
                    svgContainers.forEach(c => {
                        c.classList.remove('overflow-x-auto');
                        c.style.overflow = 'visible';
                        c.style.width = '100%';
                    });
                }

                const exportControls = clone.querySelectorAll('.export-controls');
                exportControls.forEach(c => c.remove());

                const headerDiv = document.createElement('div');
                headerDiv.className = 'p-4 mb-4 bg-white border-b border-gray-100 avoid-break';
                
                const activeFilters = [];
                if (fEdicao !== 'Todos') activeFilters.push(`Edição: ${fEdicao}`);
                if (fEtapa !== 'Todos') activeFilters.push(`Etapa: ${fEtapa}`);
                if (fTurma !== 'Todos') activeFilters.push(`Turma: ${fTurma}`);
                if (fTurno !== 'Todos') activeFilters.push(`Turno: ${fTurno}`);
                if (fCurso !== 'Todos') activeFilters.push(`Curso: ${fCurso}`);
                if (fModalidade !== 'Todos') activeFilters.push(`Modalidade: ${fModalidade}`);
                if (fSexo !== 'Todos') activeFilters.push(`Sexo: ${fSexo}`);
                if (fPcD !== 'Todos') activeFilters.push(`PcD: ${fPcD}`);
                if (fAutodeclaracao !== 'Todos') activeFilters.push(`Etnia: ${fAutodeclaracao}`);
                if (fIdade !== 'Todos') activeFilters.push(`Idade: ${fIdade}`);
                
                const filterStr = activeFilters.length > 0 ? activeFilters.join(' | ') : 'Todos os estudantes';

                headerDiv.innerHTML = `
                    <div>
                        <h2 style="font-size: 18px; font-weight: 800; color: #178a84; margin: 0; line-height: 1;">${escolaSelecionada} - ${disciplinaAtiva === 'LP' ? 'Língua Portuguesa' : 'Matemática'}</h2>
                        <p style="font-size: 12px; color: #6b7280; margin: 4px 0 0 0; font-weight: 600;">Filtros: ${filterStr}</p>
                    </div>
                `;
                clone.insertBefore(headerDiv, clone.firstChild);

                const now = new Date();
                const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                let dateStr = now.toLocaleDateString('pt-BR', dateOptions);
                dateStr = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
                const timeStr = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                const footerText = `SAME 2.0 - Sistema de Avaliação e Monitoramento Educacional | Gerado em: ${dateStr} às ${timeStr}`;

                const footerDiv = document.createElement('div');
                footerDiv.className = 'p-4 mt-4 text-center text-xs text-gray-500 font-medium border-t border-gray-100 bg-white avoid-break';
                footerDiv.innerText = footerText;
                clone.appendChild(footerDiv);

                await new Promise(resolve => setTimeout(resolve, 300)); 

                try {
                    if (formatType === 'png') {
                        const canvas = await html2canvas(clone, { 
                            scale: 2, 
                            useCORS: true, 
                            backgroundColor: '#ffffff',
                            windowWidth: exportWidth
                        });
                        const link = document.createElement('a');
                        link.download = `${filename}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    } else {
                        const isLandscape = formatType === 'pdf_landscape';
                        const opt = {
                            margin:       [0, 0, 0, 0], 
                            filename:     `${filename}.pdf`,
                            image:        { type: 'jpeg', quality: 1.0 },
                            html2canvas:  { 
                                scale: 2, 
                                useCORS: true,
                                backgroundColor: '#ffffff',
                                windowWidth: exportWidth,
                                scrollY: 0
                            },
                            jsPDF:        { 
                                unit: 'mm', 
                                format: 'a4', 
                                orientation: isLandscape ? 'landscape' : 'portrait' 
                            },
                            pagebreak:    { mode: ['css', 'legacy'], avoid: ['.avoid-break', 'tr'] } 
                        };
                        await window.html2pdf().set(opt).from(clone).save();
                    }
                } catch (error) {
                    console.error("Erro na exportação", error);
                } finally {
                    document.body.removeChild(wrapper);
                }
            };

            const ExportMenu = ({ onExport, viewType }) => {
                const [isOpen, setIsOpen] = useState(false);
                return (
                    <div className="relative inline-block text-left export-controls" data-html2canvas-ignore="true">
                        <button onClick={() => setIsOpen(!isOpen)} className="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded transition-colors" title="Exportar Relatório">
                            <IconMenu />
                        </button>
                        {isOpen && (
                            <div className="absolute right-0 mt-2 w-56 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-50">
                                <div className="py-1">
                                    {(viewType === 'grafico' || viewType === 'grafico_linha') && (
                                        <button onClick={() => { onExport('png'); setIsOpen(false); }} className="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-same-teal font-medium w-full text-left">⬇ Exportar como Imagem (.PNG)</button>
                                    )}
                                    {viewType === 'tabela' && (
                                        <>
                                            <button onClick={() => { onExport('excel'); setIsOpen(false); }} className="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-same-teal font-medium w-full text-left">⬇ Exportar Planilha (.XLSX)</button>
                                            <button onClick={() => { onExport('pdf_portrait'); setIsOpen(false); }} className="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-same-teal font-medium w-full text-left">⬇ .PDF (Retrato 9:16)</button>
                                            <button onClick={() => { onExport('pdf_landscape'); setIsOpen(false); }} className="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-same-teal font-medium w-full text-left">⬇ .PDF (Apresentação 16:9)</button>
                                        </>
                                    )}
                                </div>
                            </div>
                        )}
                        {isOpen && <div className="fixed inset-0 z-40" onClick={() => setIsOpen(false)}></div>}
                    </div>
                );
            };

            const SvgLineChart = ({ habs, turmas, turmasMap, hiddenTurmas, showLabels, colorMap, descricoes }) => {
                const w = Math.max(1000, habs.length * 40); 
                const h = 360; // Altura geral aumentada para dar mais espaço
                const padL = 40; const padB = 60; const padT = 20; const padR = 40; // Margens inferiores e direitas ampliadas
                const innerW = w - padL - padR;
                const innerH = h - padT - padB;

                const getX = (index) => padL + (habs.length > 1 ? (index / (habs.length - 1)) * innerW : innerW/2);
                const getY = (val) => padT + innerH - (val / 100) * innerH;

                const visibleData = turmas.filter(t => !hiddenTurmas.includes(t)).map((tKey) => {
                    const originalIdx = turmas.indexOf(tKey);
                    const color = colorMap ? (colorMap[tKey] || '#6b7280') : COLORS_TURMAS[originalIdx % COLORS_TURMAS.length];
                    const points = habs.map((hab, i) => {
                        const valObj = turmasMap[tKey].habs[hab];
                        const val = valObj ? valObj.percentual : 0;
                        const hasData = !!valObj;
                        return { x: getX(i), y: getY(val), val, hab, hasData };
                    });
                    let d = points.filter(p => p.hasData).length > 0 ? `M ${points.find(p => p.hasData)?.x},${points.find(p => p.hasData)?.y} ` : '';
                    
                    const dataPoints = points.filter(p => p.hasData);
                    for(let i=0; i<dataPoints.length-1; i++) {
                        const p0 = dataPoints[i]; const p1 = dataPoints[i+1];
                        const cp1x = p0.x + (p1.x - p0.x) * 0.4;
                        const cp2x = p1.x - (p1.x - p0.x) * 0.4;
                        d += `C ${cp1x},${p0.y} ${cp2x},${p1.y} ${p1.x},${p1.y} `;
                    }
                    return { tKey, color, points, d };
                });

                return (
                    <div className="w-full overflow-x-auto relative mt-4 svg-chart-container custom-scrollbar">
                        <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto min-w-[700px] font-sans">
                            {/* Grid */}
                            {[0, 25, 50, 75, 100].map(val => (
                                <g key={`grid-${val}`}>
                                    <line x1={padL} y1={getY(val)} x2={w-padR} y2={getY(val)} stroke="#f3f4f6" strokeWidth="1" />
                                    <text x={padL - 10} y={getY(val) + 4} fontSize="12" fill="#9ca3af" textAnchor="end">{val}</text>
                                </g>
                            ))}
                            
                            {/* X Axis Labels com posição Y ajustada para não cortar */}
                            {habs.map((hab, i) => (
                                <text key={`hab-${hab}`} x={getX(i)} y={h - 20} fontSize="11" fill="#6b7280" textAnchor="middle" fontWeight="bold" className="cursor-help">
                                    <title>{`${hab}\nDescrição: ${descricoes?.[hab] || '---'}`}</title>
                                    {hab}
                                </text>
                            ))}

                            {/* Lines */}
                            {visibleData.map(vd => (
                                <path key={`path-${vd.tKey}`} d={vd.d} fill="none" stroke={vd.color} strokeWidth="1.5" opacity="0.8" />
                            ))}

                            {/* Circles */}
                            {visibleData.map(vd => (
                                <g key={`circles-${vd.tKey}`}>
                                    {vd.points.filter(p => p.hasData).map((p, i) => (
                                        <circle key={i} cx={p.x} cy={p.y} r="3.5" fill="#fff" stroke={vd.color} strokeWidth="1.5" className="cursor-crosshair hover:r-[5px] transition-all">
                                            <title>{`${vd.tKey} | ${p.hab}: ${p.val.toFixed(1)}%\nDescrição: ${descricoes?.[p.hab] || '---'}`}</title>
                                        </circle>
                                    ))}
                                </g>
                            ))}

                            {/* Data Labels (Drawn last to be on top) */}
                            {showLabels && visibleData.map(vd => (
                                <g key={`labels-${vd.tKey}`}>
                                    {vd.points.filter(p => p.hasData).map((p, i) => (
                                        <g key={`lbl-${i}`}>
                                            <rect x={p.x - 14} y={p.y - 20} width="28" height="12" rx="4" fill={vd.color} opacity="0.9" />
                                            <text x={p.x} y={p.y - 11} fontSize="8" fill="#fff" textAnchor="middle" fontWeight="bold">{p.val.toFixed(0)}%</text>
                                        </g>
                                    ))}
                                </g>
                            ))}
                        </svg>
                    </div>
                )
            };

            // GRÁFICO EXCLUSIVO PARA ABA CONTEXTUAL: Eixo Y Dinâmico (Zoom) e Eixo X Centralizado
            const SvgLineChartContextual = ({ habs, turmas, turmasMap, hiddenTurmas, showLabels, colorMap }) => {
                const w = Math.max(800, habs.length * 150); 
                const h = 350; 
                const padL = 50; const padB = 40; const padT = 30; const padR = 50; 
                const innerW = w - padL - padR;
                const innerH = h - padT - padB;

                // Lógica de Zoom: Descobre a menor e a maior nota para ajustar o Eixo Y
                let minVal = 100;
                let maxVal = 0;
                let hasAnyData = false;

                turmas.filter(t => !hiddenTurmas.includes(t)).forEach(tKey => {
                    habs.forEach(hab => {
                        const valObj = turmasMap[tKey]?.habs[hab];
                        if (valObj) {
                            hasAnyData = true;
                            if (valObj.percentual < minVal) minVal = valObj.percentual;
                            if (valObj.percentual > maxVal) maxVal = valObj.percentual;
                        }
                    });
                });

                if (!hasAnyData) {
                    minVal = 0; maxVal = 100;
                } else {
                    // Dá uma "folga" de 3% para cima e para baixo para a linha não colar na borda do gráfico
                    minVal = Math.max(0, Math.floor(minVal) - 3); 
                    maxVal = Math.min(100, Math.ceil(maxVal) + 3); 
                    // Se a variação for minúscula (ex: tudo igual), força uma diferença mínima para gerar o grid
                    if (maxVal - minVal < 5) {
                        minVal = Math.max(0, minVal - 3);
                        maxVal = Math.min(100, maxVal + 3);
                    }
                }

                // Lógica de Centralização do Eixo X
                const maxGap = 250; // Largura máxima entre os pontos das edições
                const totalPointsWidth = habs.length > 1 ? (habs.length - 1) * maxGap : 0;
                const actualWidth = Math.min(innerW, totalPointsWidth);
                const startX = padL + (innerW - actualWidth) / 2;

                const getX = (index) => startX + (habs.length > 1 ? (index / (habs.length - 1)) * actualWidth : 0);
                const getY = (val) => padT + innerH - ((val - minVal) / (maxVal - minVal)) * innerH;

                const visibleData = turmas.filter(t => !hiddenTurmas.includes(t)).map((tKey) => {
                    const originalIdx = turmas.indexOf(tKey);
                    const color = colorMap ? (colorMap[tKey] || '#6b7280') : COLORS_TURMAS[originalIdx % COLORS_TURMAS.length];
                    const points = habs.map((hab, i) => {
                        const valObj = turmasMap[tKey]?.habs[hab];
                        const val = valObj ? valObj.percentual : 0;
                        const qtd = valObj ? valObj.qtd : 0; // Captura a amostra individual do grupo
                        const hasData = !!valObj;
                        return { x: getX(i), y: getY(val), val, qtd, hab, hasData };
                    });
                    
                    let d = '';
                    const dataPoints = points.filter(p => p.hasData);
                    if (dataPoints.length > 0) {
                        d += `M ${dataPoints[0].x},${dataPoints[0].y} `;
                        for(let i=0; i<dataPoints.length-1; i++) {
                            const p0 = dataPoints[i]; const p1 = dataPoints[i+1];
                            const cp1x = p0.x + (p1.x - p0.x) * 0.4;
                            const cp2x = p1.x - (p1.x - p0.x) * 0.4;
                            d += `C ${cp1x},${p0.y} ${cp2x},${p1.y} ${p1.x},${p1.y} `;
                        }
                    }
                    return { tKey, color, points, d };
                });

                // Gerar valores quebrados dinâmicos para as linhas horizontais de fundo (grid)
                const gridSteps = 4;
                const gridValues = [];
                for (let i = 0; i <= gridSteps; i++) {
                    gridValues.push(minVal + (i * (maxVal - minVal)) / gridSteps);
                }

                return (
                    <div className="w-full overflow-x-auto relative mt-4 svg-chart-container custom-scrollbar">
                        <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto min-w-[600px] font-sans">
                            {/* Grid Dinâmico com valores de 1 casa decimal */}
                            {gridValues.map((val, i) => (
                                <g key={`grid-${i}`}>
                                    <line x1={padL} y1={getY(val)} x2={w-padR} y2={getY(val)} stroke="#f3f4f6" strokeWidth="1" />
                                    <text x={padL - 10} y={getY(val) + 4} fontSize="11" fill="#9ca3af" textAnchor="end" fontWeight="bold">{val.toFixed(1)}%</text>
                                </g>
                            ))}
                            
                            {/* Rótulos do Eixo X (Edições) e Amostra */}
                            {habs.map((hab, i) => {
                                let amostraEdicao = 0;
                                turmas.filter(t => !hiddenTurmas.includes(t)).forEach(tKey => {
                                    if (turmasMap[tKey]?.habs[hab]) {
                                        amostraEdicao += turmasMap[tKey].habs[hab].qtd || 0;
                                    }
                                });

                                return (
                                    <g key={`hab-group-${hab}`}>
                                        <text x={getX(i)} y={h - 22} fontSize="12" fill="#6b7280" textAnchor="middle" fontWeight="bold">
                                            {hab}
                                        </text>
                                        {amostraEdicao > 0 && (
                                            <text x={getX(i)} y={h - 8} fontSize="9" fill="#9ca3af" textAnchor="middle" fontWeight="medium">
                                                (Amostra = {amostraEdicao})
                                            </text>
                                        )}
                                    </g>
                                );
                            })}

                            {/* Linhas Suaves do Gráfico */}
                            {visibleData.map(vd => (
                                <path key={`path-${vd.tKey}`} d={vd.d} fill="none" stroke={vd.color} strokeWidth="3" opacity="0.8" />
                            ))}

                            {/* Pontos de Dados */}
                            {visibleData.map(vd => (
                                <g key={`circles-${vd.tKey}`}>
                                    {vd.points.filter(p => p.hasData).map((p, i) => (
                                        <circle key={i} cx={p.x} cy={p.y} r="5" fill="#fff" stroke={vd.color} strokeWidth="2.5" className="cursor-crosshair hover:r-[7px] transition-all">
                                            <title>{`${vd.tKey} | Edição: ${p.hab}\nMédia: ${p.val.toFixed(1)}%\nAmostra: ${p.qtd} aluno(s)`}</title>
                                        </circle>
                                    ))}
                                </g>
                            ))}

                            {/* Rótulos Flutuantes (Balõezinhos com o valor) */}
                            {showLabels && visibleData.map(vd => (
                                <g key={`labels-${vd.tKey}`}>
                                    {vd.points.filter(p => p.hasData).map((p, i) => (
                                        <g key={`lbl-${i}`}>
                                            <rect x={p.x - 18} y={p.y - 28} width="36" height="16" rx="4" fill={vd.color} opacity="0.95" />
                                            <text x={p.x} y={p.y - 17} fontSize="9" fill="#fff" textAnchor="middle" fontWeight="bold">{p.val.toFixed(1)}%</text>
                                        </g>
                                    ))}
                                </g>
                            ))}
                        </svg>
                    </div>
                )
            };

            const LegendaInterativa = ({ turmas, hiddenTurmas, onToggle, colorMap }) => (
                <div className="flex flex-wrap gap-4 justify-center mb-4 export-controls">
                    {turmas.map((tKey, tIdx) => {
                        const isHidden = hiddenTurmas.includes(tKey);
                        const cor = colorMap ? colorMap[tKey] : COLORS_TURMAS[tIdx % COLORS_TURMAS.length];
                        return (
                            <button 
                                key={tKey} 
                                onClick={() => onToggle(tKey)}
                                className={`flex items-center gap-1.5 text-xs font-bold transition-opacity cursor-pointer ${isHidden ? 'opacity-40 line-through text-gray-400' : 'text-gray-700 hover:opacity-80'}`}
                            >
                                <span className="w-4 h-1.5 rounded-full shadow-sm" style={{backgroundColor: cor}}></span>
                                {tKey}
                            </button>
                        )
                    })}
                </div>
            );

            const LegendaEdicoesEvolucao = ({ edicoes, hiddenEdicoes, onToggle }) => (
                <div className="flex flex-wrap gap-4 justify-center mb-4 export-controls">
                    {edicoes.map((ed) => {
                        const isHidden = hiddenEdicoes.includes(ed);
                        return (
                            <button 
                                key={ed} 
                                onClick={() => onToggle(ed)}
                                className={`flex items-center gap-1.5 text-xs font-bold transition-opacity cursor-pointer ${isHidden ? 'opacity-40 line-through text-gray-400' : 'text-gray-700 hover:opacity-80'}`}
                            >
                                <span className="w-4 h-1.5 rounded-full shadow-sm" style={{backgroundColor: hexCoresEdicoes[ed] || '#6b7280'}}></span>
                                {ed}
                            </button>
                        )
                    })}
                </div>
            );
            
            // Estados - Guia Ranking
            const [viewTop10Alto, setViewTop10Alto] = useState('cards');
            const [viewTop10Baixo, setViewTop10Baixo] = useState('cards');
            const [viewTop10Masc, setViewTop10Masc] = useState('cards');
            const [viewTop10Fem, setViewTop10Fem] = useState('cards');
            const [ordemRankingCompleto, setOrdemRankingCompleto] = useState('desc'); // 'desc', 'asc', 'alfa'
            const [viewTop10Avanco, setViewTop10Avanco] = useState('cards');
            const [viewTop10Regressao, setViewTop10Regressao] = useState('cards');
            const [comparacaoEdicoesRanking, setComparacaoEdicoesRanking] = useState('SEGUNDA_PRIMEIRA');

            // Estados - Guia Distribuições
            const [viewDistAcertos, setViewDistAcertos] = useState('grafico');
            const [viewDistQuartis, setViewDistQuartis] = useState('grafico');
            const [viewDistLetra, setViewDistLetra] = useState('grafico');
            const [distLetraQuestaoSel, setDistLetraQuestaoSel] = useState('');
            const [ordemSelectDistLetra, setOrdemSelectDistLetra] = useState('questao');

            // CÁLCULOS - GUIA DISTRIBUIÇÕES
            const dadosDistribuicoes = useMemo(() => {
                if (!stats.edicaoAtualStr || baseDataEdicoes.length === 0) return null;
                const dataAtual = baseDataEdicoes.filter(d => d.edicao === stats.edicaoAtualStr);
                if (dataAtual.length === 0) return null;

                // 1. Array de 0 a 45 acertos
                const acertosArray = Array.from({length: 46}, (_, i) => ({ acertos: i, estudantes: [] }));
                
                // 2. Array de Quartis
                const quartisArray = [
                    { id: 1, label: '1º Quartil (0 a 11)', colorClass: 'bg-red-500', estudantes: [] },
                    { id: 2, label: '2º Quartil (12 a 22)', colorClass: 'bg-orange-500', estudantes: [] },
                    { id: 3, label: '3º Quartil (23 a 33)', colorClass: 'bg-green-500', estudantes: [] },
                    { id: 4, label: '4º Quartil (34 a 45)', colorClass: 'bg-blue-500', estudantes: [] }
                ];

                dataAtual.forEach(aluno => {
                    const acertos = aluno.acertosTotal;
                    if(acertos >= 0 && acertos <= 45) {
                        acertosArray[acertos].estudantes.push(aluno);
                        
                        if (acertos <= 11) quartisArray[0].estudantes.push(aluno);
                        else if (acertos <= 22) quartisArray[1].estudantes.push(aluno);
                        else if (acertos <= 33) quartisArray[2].estudantes.push(aluno);
                        else quartisArray[3].estudantes.push(aluno);
                    }
                });

                // 3. Preparando o Seletor de Questões
                const matrizHab = dbSettings.matrizes[stats.edicaoAtualStr]?.[disciplinaAtiva] || Array(45).fill('-');
                const gabaritoOficial = dbSettings.gabaritos[stats.edicaoAtualStr]?.[disciplinaAtiva] || Array(45).fill('-');
                
                const opcoesQuestao = matrizHab.map((hab, idx) => {
                    return {
                        id: idx,
                        numero: idx + 1,
                        label: `Q${String(idx + 1).padStart(2, '0')}`,
                        habilidade: hab,
                        descricao: dbSettings.habilidades[disciplinaAtiva]?.[hab] || '---',
                        gabarito: gabaritoOficial[idx]
                    };
                });

                if (ordemSelectDistLetra === 'habilidade') {
                    opcoesQuestao.sort((a, b) => {
                        if (a.habilidade < b.habilidade) return -1;
                        if (a.habilidade > b.habilidade) return 1;
                        return a.numero - b.numero;
                    });
                }

                return { acertosArray, quartisArray, opcoesQuestao, dataAtual };
            }, [baseDataEdicoes, stats.edicaoAtualStr, disciplinaAtiva, dbSettings, ordemSelectDistLetra]);

            // CÁLCULOS - GUIA RANKING
            const dadosRanking = useMemo(() => {
                if (!stats.edicaoAtualStr || baseDataEdicoes.length === 0) return null;
                const dataAtual = baseDataEdicoes.filter(d => d.edicao === stats.edicaoAtualStr);
                if (dataAtual.length === 0) return null;

                // Filtra os estudantes com notas válidas e os não avaliados/zerados
                const avaliados = dataAtual.filter(a => a.acertosTotal !== null && !isNaN(a.acertosTotal) && a.acertosTotal !== '');
                const zeros = avaliados.filter(a => a.acertosTotal === 0);
                const naoAvaliados = dataAtual.filter(a => a.acertosTotal == null || isNaN(a.acertosTotal) || a.acertosTotal === '');
                const zeradosENaoAvaliados = [...zeros, ...naoAvaliados];

                // Avaliados com > 0 acertos (para os Top 10)
                const avaliadosValidos = avaliados.filter(a => a.acertosTotal > 0);

                // Ordenações principais
                const ordenadosDesc = [...avaliadosValidos].sort((a, b) => b.acertosTotal - a.acertosTotal);
                const ordenadosAsc = [...avaliadosValidos].sort((a, b) => a.acertosTotal - b.acertosTotal);

                const top10Alto = ordenadosDesc.slice(0, 10);
                const top10Baixo = ordenadosAsc.slice(0, 10);

                // Filtragem por Sexo
                const meninos = ordenadosDesc.filter(a => String(a.sexo || '').toUpperCase().startsWith('M'));
                const meninas = ordenadosDesc.filter(a => String(a.sexo || '').toUpperCase().startsWith('F'));

                const top10Masc = meninos.slice(0, 10);
                const top10Fem = meninas.slice(0, 10);

                // Ranking Completo
                let completo = [...avaliados];
                if (ordemRankingCompleto === 'desc') {
                    completo.sort((a, b) => b.acertosTotal - a.acertosTotal);
                } else if (ordemRankingCompleto === 'asc') {
                    completo.sort((a, b) => a.acertosTotal - b.acertosTotal);
                } else if (ordemRankingCompleto === 'alfa') {
                    completo.sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
                }

                return { top10Alto, top10Baixo, zeradosENaoAvaliados, top10Masc, top10Fem, completo };
            }, [baseDataEdicoes, stats.edicaoAtualStr, ordemRankingCompleto]);

            // CÁLCULOS - EVOLUÇÃO E REGRESSÃO (EXCLUSIVO DO RANKING)
            const dadosEvolucaoRanking = useMemo(() => {
                if (!baseDataEdicoes || baseDataEdicoes.length === 0) return { avancos: [], regressoes: [] };
                
                const [edNova, edAntiga] = comparacaoEdicoesRanking.split('_');
                const dadosNovos = baseDataEdicoes.filter(d => d.edicao === edNova && d.acertosTotal !== null && d.acertosTotal !== '');
                const dadosAntigos = baseDataEdicoes.filter(d => d.edicao === edAntiga && d.acertosTotal !== null && d.acertosTotal !== '');
                
                const evolucaoArray = [];
                
                dadosNovos.forEach(alunoNovo => {
                    const alunoAntigo = dadosAntigos.find(a => (a.nome || '').trim() === (alunoNovo.nome || '').trim() && a.nome);
                    if (alunoAntigo) {
                        evolucaoArray.push({
                            ...alunoNovo,
                            acertosAntigo: alunoAntigo.acertosTotal,
                            delta: alunoNovo.acertosTotal - alunoAntigo.acertosTotal
                        });
                    }
                });
                
                const avancos = [...evolucaoArray].filter(a => a.delta > 0).sort((a, b) => b.delta - a.delta).slice(0, 10);
                const regressoes = [...evolucaoArray].filter(a => a.delta < 0).sort((a, b) => a.delta - b.delta).slice(0, 10);
                
                return { avancos, regressoes };
            }, [baseDataEdicoes, comparacaoEdicoesRanking]);
            
            // Auto-selecionar a primeira questão no terceiro gráfico
            useEffect(() => {
                if (dadosDistribuicoes && dadosDistribuicoes.opcoesQuestao.length > 0) {
                    if (distLetraQuestaoSel === '' || !dadosDistribuicoes.opcoesQuestao.find(q => q.id.toString() === distLetraQuestaoSel)) {
                        setDistLetraQuestaoSel(dadosDistribuicoes.opcoesQuestao[0].id.toString());
                    }
                }
            }, [dadosDistribuicoes, distLetraQuestaoSel]);

            // Lógica para o Gráfico de Letras Marcadas
            const dadosDistLetraAtual = useMemo(() => {
                if (!dadosDistribuicoes || distLetraQuestaoSel === '') return null;
                
                const questaoIdx = parseInt(distLetraQuestaoSel, 10);
                if (isNaN(questaoIdx)) return null;

                const qInfo = dadosDistribuicoes.opcoesQuestao.find(q => q.id === questaoIdx);
                
                const contagemLetras = {
                    'A': { letra: 'A', estudantes: [], colorClass: 'bg-gray-400' },
                    'B': { letra: 'B', estudantes: [], colorClass: 'bg-gray-400' },
                    'C': { letra: 'C', estudantes: [], colorClass: 'bg-gray-400' },
                    'D': { letra: 'D', estudantes: [], colorClass: 'bg-gray-400' },
                    'E': { letra: 'E', estudantes: [], colorClass: 'bg-gray-400' },
                    '*': { letra: 'Nulo/Branco', estudantes: [], colorClass: 'bg-gray-300' }
                };

                if (qInfo && contagemLetras[qInfo.gabarito]) {
                    contagemLetras[qInfo.gabarito].colorClass = 'bg-same-teal'; // Pinta o gabarito correto com a cor do sistema
                }

                dadosDistribuicoes.dataAtual.forEach(aluno => {
                    let resp = aluno.respostasString[questaoIdx] || '*';
                    if (!contagemLetras[resp]) resp = '*';
                    contagemLetras[resp].estudantes.push(aluno);
                });

                return {
                    questaoInfo: qInfo,
                    distribuicao: Object.values(contagemLetras)
                };
            }, [dadosDistribuicoes, distLetraQuestaoSel]);

            // Estado para a nova Janela de Detalhamento de Estudantes
            const [modalEstudantes, setModalEstudantes] = useState({ open: false, title: '', estudantes: [] });

            // Estados para controle individualizado dos marcadores contextuais
            const [viewSexo, setViewSexo] = useState('grafico');
            const [showLabelsSexo, setShowLabelsSexo] = useState(true);
            const [hiddenSexo, setHiddenSexo] = useState([]);

            const [viewIdade, setViewIdade] = useState('grafico');
            const [showLabelsIdade, setShowLabelsIdade] = useState(true);
            const [hiddenIdade, setHiddenIdade] = useState([]);

            const [viewPcd, setViewPcd] = useState('grafico');
            const [showLabelsPcd, setShowLabelsPcd] = useState(true);
            const [hiddenPcd, setHiddenPcd] = useState([]);

            const [viewAuto, setViewAuto] = useState('grafico');
            const [showLabelsAuto, setShowLabelsAuto] = useState(true);
            const [hiddenAuto, setHiddenAuto] = useState([]);

            // Função auxiliar para renderizar os cartões didáticos
            const renderCardEstudante = (est, index, colorTheme, customValue) => (
                <div key={index} className={`flex items-center gap-4 p-4 rounded-xl border ${colorTheme.border} ${colorTheme.bg} shadow-sm relative group hover:shadow-md transition-shadow`}>
                    <div className={`absolute top-0 left-0 w-1.5 h-full ${colorTheme.bar} rounded-l-xl`}></div>
                    <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black text-white ${colorTheme.badge} z-10 shrink-0 ml-2`}>
                        #{index + 1}
                    </div>
                    <div className="flex-1 min-w-0">
                        <h4 className="font-extrabold text-gray-800 text-sm truncate uppercase" title={est.nome}>{est.nome || 'ESTUDANTE'}</h4>
                        <p className="text-[10px] md:text-xs text-gray-500 font-bold truncate">{est.etapa} • {est.turma} • {est.turno || '-'} • {est.curso || '-'}</p>
                    </div>
                    <div className="text-right shrink-0">
                        {customValue ? customValue : (
                            <>
                                <div className={`text-lg font-black ${colorTheme.text}`}>{est.acertosTotal}/45</div>
                                <div className="text-[10px] font-bold text-gray-400">{est?.percentual?.toFixed(1)}%</div>
                            </>
                        )}
                    </div>
                </div>
            );

            // Função auxiliar para renderizar as tabelas completas
            const renderTabelaTop10 = (dados, corCabecalho, corTexto, mostrarDelta = false) => (
                <div className="overflow-x-auto border rounded-lg">
                    <table className="min-w-full text-sm text-left whitespace-nowrap">
                        <thead className={`${corCabecalho} text-white`}>
                            <tr>
                                <th className="p-3">Pos.</th>
                                <th className="p-3">Estudante</th>
                                <th className="p-3">Etapa</th>
                                <th className="p-3">Turma</th>
                                <th className="p-3">Turno</th>
                                <th className="p-3">Curso</th>
                                <th className="p-3 text-center">{mostrarDelta ? 'Variação' : 'Acertos'}</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100">
                            {dados.map((est, i) => (
                                <tr key={i} className="hover:bg-gray-50">
                                    <td className="p-3 font-bold text-gray-500">{i + 1}º</td>
                                    <td className="p-3 font-bold uppercase">{est.nome}</td>
                                    <td className="p-3">{est.etapa}</td>
                                    <td className="p-3">{est.turma}</td>
                                    <td className="p-3">{est.turno || '-'}</td>
                                    <td className="p-3 text-xs text-gray-500">{est.curso || '-'}</td>
                                    <td className={`p-3 text-center font-bold ${corTexto}`}>
                                        {mostrarDelta ? (
                                            <span className="flex flex-col">
                                                <span>{est.delta > 0 ? `+${est.delta}` : est.delta} Acertos</span>
                                                <span className="text-[10px] text-gray-400">({est.acertosAntigo} ➔ {est.acertosTotal})</span>
                                            </span>
                                        ) : (
                                            <span>{est.acertosTotal}/45 ({est?.percentual?.toFixed(1)}%)</span>
                                        )}
                                    </td>
                                </tr>
                            ))}
                            {dados.length === 0 && <tr><td colSpan="7" className="p-4 text-center text-gray-500 font-bold">Dados insuficientes.</td></tr>}
                        </tbody>
                    </table>
                </div>
            );

            // Função para abrir a imagem da questão na aba Estudantes
            const abrirQuestaoEstudante_AbaEst = (edicao, qIdx) => {
                const qNumero = `Q${String(qIdx + 1).padStart(2, '0')}`;
                const questaoData = dbSettings.questoes?.find(q => 
                    String(q['EDIÇÃO']).toUpperCase() === String(edicao).toUpperCase() && 
                    String(q['DISCIPLINA']).toUpperCase() === String(disciplinaAtiva).toUpperCase() && 
                    String(q['QUESTÃO']).toUpperCase() === qNumero
                );
                
                if (questaoData && questaoData['LINK_QUESTAO']) {
                    setModalPreview({
                        open: true,
                        activeType: 'item',
                        itemUrl: questaoData['LINK_QUESTAO'],
                        gabaritoUrl: questaoData['LINK_GABARITO_COMENTADO'] || questaoData['LINK_QUESTAO']
                    });
                } else {
                    alert(`Imagem da questão ${qNumero} não disponível na base de dados para a ${edicao} edição.`);
                }
            };

            // Gerenciador de Visualização de Itens Pedagógicos (Exclusivo da Guia Materiais)
            const abrirItemPedagogico_AbaMat = (questaoObj) => {
                if (questaoObj.linkQuestao) {
                    setModalPreview({
                        open: true,
                        activeType: 'item',
                        itemUrl: questaoObj.linkQuestao,
                        gabaritoUrl: questaoObj.linkGabarito || questaoObj.linkQuestao
                    });
                } else {
                    alert(`O arquivo de imagem associado ao item ${questaoObj.label} não foi localizado para esta edição.`);
                }
            };

            // RENDERIZAÇÃO
            if (etapa === 0 || etapa === 1 || etapa === 2) {
                return (
                    <div className="min-h-screen bg-same-bg flex flex-col items-center pt-10 px-4">
                        <img src={LOGO_URL} alt="SAME Logo" className="h-32 mb-4 drop-shadow-md" />
                        <h1 className="text-3xl font-extrabold text-same-teal mb-1 text-center">Sistema de Avaliação e Monitoramento Educacional</h1>
                        <p className="text-gray-500 mb-8 text-center text-sm md:text-base">
                            {etapa === 0 ? "Aguarde, conectando ao servidor..." : etapa === 1 ? "Identifique sua escola para acessar." : "Cole os dados dos estudantes para iniciar a análise"}
                        </p>

                        <div className="bg-white rounded-xl shadow-xl p-8 w-full max-w-4xl border border-gray-100">
                            {etapa === 0 && (
                                <div className="text-center flex flex-col items-center py-10">
                                    <IconDatabase />
                                    <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-same-teal mb-4"></div>
                                    <p className="text-gray-600">Verificando credenciais e base de dados na nuvem...</p>
                                </div>
                            )}

                            {etapa === 1 && (
                                <div className="max-w-md mx-auto flex flex-col gap-5">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">Escola / Perfil</label>
                                        <select className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-same-teal outline-none bg-gray-50" value={escolaSelecionada} onChange={(e) => setEscolaSelecionada(e.target.value)}>
                                            <option value="">-- Selecione o Acesso --</option>
                                            {escolasDisponiveis.map(esc => <option key={esc} value={esc}>{esc}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">Senha de Acesso</label>
                                        <input type="password" placeholder="Sua senha" value={senhaAcesso} onChange={(e) => setSenhaAcesso(e.target.value)} className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-same-teal outline-none bg-gray-50" />
                                    </div>
                                    <button onClick={handleLogin} disabled={isProcessing} className="w-full mt-4 bg-same-teal hover:bg-same-tealDark text-white font-bold py-3 px-6 rounded-full shadow-lg transition-transform transform hover:scale-105 disabled:opacity-50">
                                        {isProcessing ? 'Validando...' : 'Acessar Plataforma'}
                                    </button>
                                </div>
                            )}

                            {etapa === 2 && (
                                <div className="flex flex-col gap-4">
                                    <div className="flex justify-between items-center mb-2">
                                        <div className="flex items-center gap-2">
                                            <IconClipboard />
                                            <span className="font-semibold text-gray-700">Dados dos Estudantes ({escolaSelecionada})</span>
                                        </div>
                                        {isMaster && <span className="bg-red-100 text-red-800 text-xs font-bold px-2 py-1 rounded">ACESSO MASTER (CREDE)</span>}
                                    </div>
                                    <p className="text-xs text-gray-500 mb-2">Cole os dados brutos da planilha incluindo o cabeçalho</p>
                                    
                                    <textarea 
                                        className="w-full h-64 p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-same-teal outline-none font-mono text-xs resize-none bg-gray-50 custom-scrollbar whitespace-nowrap overflow-auto" 
                                        placeholder="INEP ESCOLA MATRÍCULA ESTUDANTE SEXO PCD AUTODECLARAÇÃO IDADE EDIÇÃO DISCIPLINA MUNICÍPIO MODALIDADE ETAPA TURMA CURSO TURNO AVALIADO Q01 Q02..."
                                        value={inputText} onChange={(e) => setInputText(e.target.value)}
                                    ></textarea>
                                    
                                    <div className="flex justify-between items-center mt-2">
                                        <span className="text-sm text-gray-500 font-medium">{inputText.trim() ? inputText.split('\n').length - 1 : 0} registros colados</span>
                                        <button onClick={processData} disabled={isProcessing || !inputText.trim()} className="bg-same-orange hover:bg-same-orangeDark text-white font-bold py-2.5 px-8 rounded-full shadow transition-all hover:-translate-y-0.5 disabled:opacity-50 flex items-center gap-2">
                                            <IconSearch />
                                            {isProcessing ? 'Analisando...' : 'Analisar Dados'}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {status.message && (
                                <div className={`mt-4 p-3 text-sm rounded-lg text-center font-medium ${status.type === 'error' ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-blue-50 text-blue-600'}`}>{status.message}</div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col">
                    <header className="bg-same-teal text-white p-3 shadow-md flex justify-between items-center z-50 relative">
                        <div className="flex items-center gap-4">
                            <img src={LOGO_URL} alt="Logo" className="h-12 bg-white rounded p-1 shadow-sm" />
                            <div>
                                <h1 className="text-xl font-extrabold tracking-tight leading-tight">SAME</h1>
                                <p className="text-xs font-medium text-teal-100 uppercase">{escolaSelecionada}</p>
                            </div>
                        </div>
                        <button onClick={() => setEtapa(2)} className="bg-white/20 hover:bg-white/30 px-4 py-1.5 rounded-full text-sm font-semibold transition-colors backdrop-blur-sm">← Voltar</button>
                    </header>

                    <div className="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-40">
                        <div className="w-full mx-auto px-4 md:px-8 py-3">
                            <div className="flex items-center gap-4 mb-2">
                                <div className="flex gap-2">
                                    <button onClick={() => setShowFilters(!showFilters)} title="Filtros de Dados" className={`p-2 rounded-lg transition-colors border ${showFilters ? 'bg-teal-50 text-same-teal border-teal-200' : 'bg-white text-gray-500 hover:bg-gray-50 border-gray-200'}`}>
                                        <IconFilter />
                                    </button>
                                    <button onClick={() => setShowTabs(!showTabs)} title="Abas de Navegação" className={`p-2 rounded-lg transition-colors border ${showTabs ? 'bg-teal-50 text-same-teal border-teal-200' : 'bg-white text-gray-500 hover:bg-gray-50 border-gray-200'}`}>
                                        <IconLayout />
                                    </button>
                                </div>

                                <div className="flex-1 flex justify-center">
                                    <div className="bg-gray-100 p-1 rounded-full flex shadow-inner border border-gray-200">
                                        <button onClick={() => setDisciplinaAtiva('LP')} className={`flex items-center gap-2 px-6 py-1.5 rounded-full font-bold text-sm transition-all ${disciplinaAtiva === 'LP' ? 'bg-same-teal text-white shadow-md' : 'text-gray-500 hover:text-gray-700'}`}>
                                            📚 Língua Portuguesa
                                        </button>
                                        <button onClick={() => setDisciplinaAtiva('MT')} className={`flex items-center gap-2 px-6 py-1.5 rounded-full font-bold text-sm transition-all ${disciplinaAtiva === 'MT' ? 'bg-same-teal text-white shadow-md' : 'text-gray-500 hover:text-gray-700'}`}>
                                            🔢 Matemática
                                        </button>
                                    </div>
                                </div>
                                <div className="w-[84px]"></div>
                            </div>

                            {showFilters && (
                                <div className="bg-white border border-gray-200 rounded-lg p-4 mb-3 shadow-sm text-sm">
                                    <div className="flex justify-between items-center mb-3">
                                        <span className="font-bold text-gray-700 flex items-center gap-2"><IconFilter /> Filtros de Dados</span>
                                        <button onClick={limparFiltros} className="text-xs text-same-teal hover:underline font-semibold flex items-center gap-1">
                                            <IconRefresh /> Limpar
                                        </button>
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
                                        <select value={fEdicao} onChange={e=>setFEdicao(e.target.value)} className="border border-gray-300 rounded p-1.5 text-gray-700 outline-none focus:border-same-teal">
                                            <option value="Todos">Edição: Todas</option>
                                            {getUnique('edicao').map(o => <option key={o} value={o}>&gt; {o}</option>)}
                                        </select>
                                        <select value={fEtapa} onChange={e=>setFEtapa(e.target.value)} className="border border-gray-300 rounded p-1.5 text-gray-700 outline-none focus:border-same-teal">
                                            <option value="Todos">Etapa: Todas</option>
                                            {getUnique('etapa').map(o => <option key={o} value={o}>&gt; {o}</option>)}
                                        </select>
                                        <select value={fTurma} onChange={e=>setFTurma(e.target.value)} className="border border-gray-300 rounded p-1.5 text-gray-700 outline-none focus:border-same-teal">
                                            <option value="Todos">Turma: Todas</option>
                                            {getUnique('turma').map(o => <option key={o} value={o}>&gt; {o}</option>)}
                                        </select>
                                        <select value={fTurno} onChange={e=>setFTurno(e.target.value)} className="border border-gray-300 rounded p-1.5 text-gray-700 outline-none focus:border-same-teal">
                                            <option value="Todos">Turno: Todos</option>
                                            {getUnique('turno').map(o => <option key={o} value={o}>&gt; {o}</option>)}
                                        </select>
                                        <select value={fCurso} onChange={e=>setFCurso(e.target.value)} className="border border-gray-300 rounded p-1.5 text-gray-700 outline-none focus:border-same-teal">
                                            <option value="Todos">Curso: Todos</option>
                                            {getUnique('curso').map(o => <option key={o} value={o}>&gt; {o}</option>)}
                                        </select>
                                        <select value={fModalidade} onChange={e=>setFModalidade(e.target.value)} className="border border-gray-300 rounded p-1.5 text-gray-700 outline-none focus:border-same-teal">
                                            <option value="Todos">Modalidade: Todas</option>
                                            {getUnique('modalidade').map(o => <option key={o} value={o}>&gt; {o}</option>)}
                                        </select>
                                        <select value={fSexo} onChange={e=>setFSexo(e.target.value)} className="border border-gray-300 rounded p-1.5 text-gray-700 outline-none focus:border-same-teal">
                                            <option value="Todos">Sexo: Todos</option>
                                            {getUnique('sexo').map(o => <option key={o} value={o}>&gt; {o}</option>)}
                                        </select>
                                        <select value={fPcD} onChange={e=>setFPcD(e.target.value)} className="border border-gray-300 rounded p-1.5 text-gray-700 outline-none focus:border-same-teal">
                                            <option value="Todos">PcD: Todos</option>
                                            {getUnique('pcd').map(o => <option key={o} value={o}>&gt; {o}</option>)}
                                        </select>
                                        <select value={fAutodeclaracao} onChange={e=>setFAutodeclaracao(e.target.value)} className="border border-gray-300 rounded p-1.5 text-gray-700 outline-none focus:border-same-teal">
                                            <option value="Todos">Etnia: Todas</option>
                                            {getUnique('autodeclaracao').map(o => <option key={o} value={o}>&gt; {o}</option>)}
                                        </select>
                                        <select value={fIdade} onChange={e=>setFIdade(e.target.value)} className="border border-gray-300 rounded p-1.5 text-gray-700 outline-none focus:border-same-teal">
                                            <option value="Todos">Idade: Todas</option>
                                            {getUnique('idade').map(o => <option key={o} value={o}>&gt; {o}</option>)}
                                        </select>
                                    </div>
                                </div>
                            )}

                            {showTabs && (
                                <div className="flex gap-2 overflow-x-auto pb-1 mt-1 custom-scrollbar">
                                    {tabs.map(tab => {
                                        const tabKey = tab.replace(/\s+/g, '');
                                        const isActive = abaAtiva === tabKey;
                                        return (
                                            <button 
                                                key={tab} 
                                                onClick={() => setAbaAtiva(tabKey)}
                                                className={`whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-semibold border transition-all ${isActive ? 'bg-same-teal border-same-teal text-white shadow-md' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`}
                                            >
                                                {tab}
                                            </button>
                                        )
                                    })}
                                </div>
                            )}
                        </div>
                    </div>

                    <main className="w-full mx-auto px-4 md:px-8 py-6 flex-grow relative z-10">
                        {abaAtiva === 'VisãoGeral' ? (
                            <div className="flex flex-col gap-6">
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                    {renderCard("Total de Estudantes", "total", "", "border-l-blue-500")}
                                    {renderCard("Média de Acertos", "media", "%", "border-l-green-500")}
                                    {renderCard("Mediana", "mediana", "%", "border-l-yellow-500")}
                                    {renderCard("Desvio Padrão", "dp", "%", "border-l-orange-500")}
                                </div>

                                <div id="card-distribuicao" className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 relative">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                                        <h3 className="font-bold text-gray-800 flex items-center gap-2"><span className="text-lg">📊</span> Distribuição de Acertos</h3>
                                        <div className="flex flex-wrap items-center gap-2 export-controls">
                                            {viewDistribuicao === 'grafico' && (
                                                <div className="flex bg-gray-100 rounded-md p-1 border border-gray-200" data-html2canvas-ignore="true">
                                                    <button onClick={() => setRotuloDistribuicao('absoluto')} className={`flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded transition-colors ${rotuloDistribuicao === 'absoluto' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}># Absoluto</button>
                                                    <button onClick={() => setRotuloDistribuicao('percentual')} className={`flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded transition-colors ${rotuloDistribuicao === 'percentual' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>% Percentual</button>
                                                </div>
                                            )}
                                            <div className="flex bg-gray-100 rounded-md p-1 border border-gray-200" data-html2canvas-ignore="true">
                                                <button onClick={() => setViewDistribuicao('grafico')} className={`flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded transition-colors ${viewDistribuicao === 'grafico' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}><IconBarChart/> Gráfico</button>
                                                <button onClick={() => setViewDistribuicao('tabela')} className={`flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded transition-colors ${viewDistribuicao === 'tabela' ? 'bg-same-teal text-white shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}><IconTable/> Tabela</button>
                                            </div>
                                            <ExportMenu viewType={viewDistribuicao} onExport={(format) => handleExport('card-distribuicao', viewDistribuicao, format, 'distribuicao_acertos')} />
                                        </div>
                                    </div>
                                    
                                    {fEdicao === 'Todos' && stats.edicoesPresentes.length > 1 && (
                                        <div className="flex gap-4 justify-center mb-4">
                                            {stats.edicoesPresentes.map(ed => (
                                                <div key={ed} className="flex items-center gap-1 text-xs font-bold text-gray-600">
                                                    <span className={`w-3 h-3 rounded-full ${coresEdicoes[ed] || 'bg-gray-500'}`}></span>
                                                    {ed}
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {viewDistribuicao === 'grafico' ? (
                                        <div className="h-72 flex items-end justify-around gap-4 px-4 pt-12 border-b-2 border-l-2 border-gray-200 relative mb-12 mt-4 w-full">
                                            <div className="absolute top-0 w-full border-t border-gray-100 left-0"></div>
                                            <div className="absolute top-1/4 w-full border-t border-gray-100 left-0"></div>
                                            <div className="absolute top-2/4 w-full border-t border-gray-100 left-0"></div>
                                            <div className="absolute top-3/4 w-full border-t border-gray-100 left-0"></div>

                                            {['0-25%', '25-50%', '50-75%', '75-100%'].map((label, i) => {
                                                const barColorsDefault = ['bg-red-500', 'bg-orange-500', 'bg-yellow-400', 'bg-green-500'];
                                                if (fEdicao === 'Todos' && stats.edicoesPresentes.length > 1) {
                                                    return (
                                                        <div key={i} className="flex flex-col items-center flex-1 h-full justify-end relative z-0 group">
                                                            <div className="relative w-full flex items-end justify-center gap-1 md:gap-2 h-full">
                                                                {stats.edicoesPresentes.map(ed => {
                                                                    const val = stats.statsPorEdicao[ed].distribuicao[i];
                                                                    const totalEd = stats.statsPorEdicao[ed].total || 1;
                                                                    const maxOverall = Math.max(...stats.edicoesPresentes.map(e => Math.max(...stats.statsPorEdicao[e].distribuicao)));
                                                                    const h = Math.max((val / (maxOverall || 1)) * 90, 1);

                                                                    return (
                                                                        <div key={ed} className="relative flex flex-col items-center justify-end w-full max-w-[65px]" style={{ height: `${h}%` }}>
                                                                            <span className="absolute -top-6 text-[9px] md:text-xs font-bold text-gray-600 whitespace-nowrap">
                                                                                {rotuloDistribuicao === 'absoluto' ? val : `${totalEd > 0 ? ((val / totalEd) * 100).toFixed(1) : '0.0'}%`}
                                                                            </span>
                                                                            <div className={`w-full h-full ${coresEdicoes[ed] || 'bg-gray-500'} rounded-t-sm transition-all hover:opacity-80`} title={`${ed}: ${val} estudantes (${totalEd > 0 ? ((val / totalEd) * 100).toFixed(1) : '0.0'}%)`}></div>
                                                                        </div>
                                                                    )
                                                                })}
                                                            </div>
                                                            <div className="absolute -bottom-8 w-full flex flex-col items-center justify-center">
                                                                <span className="text-[10px] md:text-xs text-gray-700 font-extrabold leading-tight">{label}</span>
                                                            </div>
                                                        </div>
                                                    )
                                                } else {
                                                    const edicaoCalculo = fEdicao !== 'Todos' ? fEdicao : stats.edicoesPresentes[0];
                                                    const val = stats.statsPorEdicao[edicaoCalculo]?.distribuicao[i] ?? 0;
                                                    const totalCalc = stats.statsPorEdicao[edicaoCalculo]?.total || 1;
                                                    const max = Math.max(...(stats.statsPorEdicao[edicaoCalculo]?.distribuicao || [0])) || 1;
                                                    const h = Math.max((val / max) * 90, 1);
                                                    
                                                    return (
                                                        <div key={i} className="flex flex-col items-center flex-1 h-full justify-end relative z-0 group">
                                                            <div className="relative w-4/5 max-w-[140px] flex flex-col items-center justify-end" style={{ height: `${h}%` }}>
                                                                <span className="absolute -top-6 text-xs md:text-sm font-black text-gray-700 whitespace-nowrap">
                                                                    {rotuloDistribuicao === 'absoluto' ? val : `${totalCalc > 0 ? ((val / totalCalc) * 100).toFixed(1) : '0.0'}%`}
                                                                </span>
                                                                <div className={`w-full h-full ${barColorsDefault[i]} rounded-t-md transition-all duration-500 z-10 hover:opacity-80`}></div>
                                                            </div>
                                                            <div className="absolute -bottom-8 w-full flex flex-col items-center justify-center">
                                                                <span className="text-[10px] md:text-xs text-gray-700 font-extrabold leading-tight">{label}</span>
                                                            </div>
                                                        </div>
                                                    )
                                                }
                                            })}
                                        </div>
                                    ) : (
                                        <div className="animate-fade-in">
                                            <div className="overflow-x-auto mb-4 border border-gray-200 rounded-lg avoid-break">
                                                <table className="min-w-full text-sm text-center border-collapse">
                                                    <thead>
                                                        <tr className="bg-same-teal text-white">
                                                            <th className="py-3 px-4 text-left font-bold">Faixa de Desempenho</th>
                                                            {fEdicao === 'Todos' && stats.edicoesPresentes.length > 1 ? (
                                                                stats.edicoesPresentes.map(ed => (
                                                                    <th key={ed} className="py-3 px-4 font-bold">{ed}</th>
                                                                ))
                                                            ) : (
                                                                <>
                                                                    <th className="py-3 px-4 font-bold">Quantidade</th>
                                                                    <th className="py-3 px-4 font-bold">Percentual</th>
                                                                </>
                                                            )}
                                                        </tr>
                                                    </thead>
                                                    <tbody className="text-gray-700 divide-y divide-gray-100">
                                                        {['0-25%', '25-50%', '50-75%', '75-100%'].map((label, i) => (
                                                            <tr key={i} className="hover:bg-gray-50 avoid-break" style={{ pageBreakInside: 'avoid' }}>
                                                                <td data-t="s" data-v={label} className="py-3 px-4 font-extrabold text-left">{label}</td>
                                                                {fEdicao === 'Todos' && stats.edicoesPresentes.length > 1 ? (
                                                                    stats.edicoesPresentes.map(ed => {
                                                                        const val = stats.statsPorEdicao[ed].distribuicao[i];
                                                                        const totalEd = stats.statsPorEdicao[ed].total || 1;
                                                                        const perc = ((val / totalEd) * 100).toFixed(1);
                                                                        return <td key={ed} data-t="s" data-v={`${val} (${perc}%)`} className="py-3 px-4 font-bold">{val} <span className="text-xs text-gray-500 font-medium">({perc}%)</span></td>
                                                                    })
                                                                ) : (
                                                                    <React.Fragment>
                                                                        <td data-t="n" data-v={stats.statsPorEdicao[fEdicao !== 'Todos' ? fEdicao : stats.edicoesPresentes[0]]?.distribuicao[i] ?? 0} className="py-3 px-4 font-bold">{stats.statsPorEdicao[fEdicao !== 'Todos' ? fEdicao : stats.edicoesPresentes[0]]?.distribuicao[i] ?? 0}</td>
                                                                        <td data-t="s" data-v={`${stats.statsPorEdicao[fEdicao !== 'Todos' ? fEdicao : stats.edicoesPresentes[0]]?.total > 0 ? ((stats.statsPorEdicao[fEdicao !== 'Todos' ? fEdicao : stats.edicoesPresentes[0]].distribuicao[i] / stats.statsPorEdicao[fEdicao !== 'Todos' ? fEdicao : stats.edicoesPresentes[0]].total) * 100).toFixed(1) : '0.0'}%`} className="py-3 px-4 font-bold">
                                                                            {stats.statsPorEdicao[fEdicao !== 'Todos' ? fEdicao : stats.edicoesPresentes[0]]?.total > 0 ? 
                                                                                ((stats.statsPorEdicao[fEdicao !== 'Todos' ? fEdicao : stats.edicoesPresentes[0]].distribuicao[i] / stats.statsPorEdicao[fEdicao !== 'Todos' ? fEdicao : stats.edicoesPresentes[0]].total) * 100).toFixed(1) : '0.0'}%
                                                                        </td>
                                                                    </React.Fragment>
                                                                )}
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                            {analiseDistribuicao && (
                                                <div className="bg-gradient-to-r from-teal-50 to-blue-50 p-4 rounded-lg border-l-4 border-same-teal avoid-break" style={{ pageBreakInside: 'avoid' }}>
                                                    <h4 className="text-sm font-bold text-gray-800 flex items-center gap-2 mb-1">📊 Análise da Distribuição:</h4>
                                                    <p className="text-sm text-gray-700 leading-relaxed font-medium">{analiseDistribuicao}</p>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                    <div className="mt-8"></div>
                                </div>

                                <div id="card-taxa" className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 relative">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
