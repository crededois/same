            // Filtros Globais
            const [fEdicao, setFEdicao] = useState('Todos');

            const [fTurma, setFTurma] = useState('Todos');

            const tabs = ['Visão Geral', 'Habilidades', 'Dificuldade', 'Contextual', 'Distribuições', 'Ranking', 'Estudantes', 'Materiais', 'SPAECE TRI'];

            const getAgrupamento = (perc) => {
                if (perc <= 40) return 'Baixo';
                if (perc <= 60) return 'Médio Baixo';
                if (perc <= 80) return 'Médio Alto';
                return 'Alto';
            };

            useEffect(() => {
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getEscolas' })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === "sucesso") {
                        setEscolasDisponiveis(data.escolas);
                        setEtapa(1); 
                    }
                })
                .catch(err => setStatus({ message: 'Erro de conexão com o servidor.', type: 'error' }));
            }, []);

            const handleLogin = async () => {
                if (!escolaSelecionada || !senhaAcesso) return setStatus({ message: 'Preencha escola e senha.', type: 'warning' });
                
                setIsProcessing(true);
                setStatus({ message: 'Autenticando no servidor...', type: 'info' });

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'login', escola: escolaSelecionada, senha: senhaAcesso })
                    });
                    const result = await response.json();

                    if (result.status === "sucesso") {
                        setMetadadosGlobais(result.metadados);
                        setIsMaster(result.isMaster);
                        
                        // --- PROCESSAMENTO DO BANCO DE DADOS DINÂMICO ---
                        const newGabaritos = {};
                        const newMatrizes = {};
                        const newHabilidades = { 'LP': {}, 'MT': {} };
                        
                        const extract45 = (row) => {
                            const arr = [];
                            for (let i = 1; i <= 45; i++) {
                                const key = `Q${String(i).padStart(2, '0')}`;
                                arr.push(row[key] ? String(row[key]).trim() : '-');
                            }
                            return arr;
                        };

                        if (result.db && result.db.gabaritos) {
                            result.db.gabaritos.forEach(row => {
                                const edicao = String(row['EDIÇÃO']).toUpperCase().trim();
                                const disc = String(row['DISCIPLINA']).toUpperCase().trim();
                                if (!newGabaritos[edicao]) newGabaritos[edicao] = {};
                                newGabaritos[edicao][disc] = extract45(row).map(r => r === '-' ? '*' : r);
                            });
                        }

                        if (result.db && result.db.matrizes) {
                            result.db.matrizes.forEach(row => {
                                const edicao = String(row['EDIÇÃO']).toUpperCase().trim();
                                const disc = String(row['DISCIPLINA']).toUpperCase().trim();
                                if (!newMatrizes[edicao]) newMatrizes[edicao] = {};
                                newMatrizes[edicao][disc] = extract45(row);
                            });
                        }

                        if (result.db && result.db.habilidades) {
                            result.db.habilidades.forEach(row => {
                                const disc = String(row['DISCIPLINA']).toUpperCase().trim();
                                const hab = String(row['HABILIDADE']).toUpperCase().trim();
                                const desc = row['DESCRIÇÃO'];
                                if(newHabilidades[disc]) {
                                    newHabilidades[disc][hab] = desc;
                                }
                            });
                        }

                        setDbSettings({
                            gabaritos: newGabaritos,
                            matrizes: newMatrizes,
                            habilidades: newHabilidades,
                            materiais: result.db?.materiais || [],
                            questoes: result.db?.questoes || [],
                            spaece: result.db?.spaece || []
                        });
                        // ------------------------------------------------
                        
                        setStatus({ message: `Bem-vindo(a), acesso validado!`, type: 'success' });
                        setEtapa(2);
                    } else {
                        setStatus({ message: 'Senha incorreta ou acesso negado.', type: 'error' });
                    }
                } catch (error) {
                    console.error("Erro na API:", error);
                    setStatus({ message: 'Erro de comunicação.', type: 'error' });
                }
                setIsProcessing(false);
            };

            const processData = () => {
                setIsProcessing(true);
                setStatus({ message: 'Processando dados...', type: 'info' });

                setTimeout(() => {
                    try {
                        const lines = inputText.trim().split('\n');
                        const results = [];
                        const corrigidos = [];
                        let errorCount = 0;

                        const headerLine = lines[0].trim().toUpperCase();
                        let hasHeader = headerLine.includes('INEP');
                        let startIndex = hasHeader ? 1 : 0;
                        
                        let colsHeader = hasHeader ? (headerLine.split('\t').length > 1 ? headerLine.split('\t') : headerLine.split(/\s{2,}/)) : [];
                        const hMap = {};
                        colsHeader.forEach((c, idx) => hMap[c.trim()] = idx);

                        const getVal = (colunas, key, fallbackIdx) => {
                            if(hMap[key] !== undefined) return colunas[hMap[key]]?.trim() || '-';
                            return colunas[fallbackIdx] !== undefined ? colunas[fallbackIdx]?.trim() : '-';
                        };

                        for (let i = startIndex; i < lines.length; i++) {
                            const line = lines[i].trim();
                            if (!line) continue;

                            let colunas = line.split('\t');
                            let respostasRaw = "";
                            let restoLinha = line; // <- AQUI ESTÁ A CORREÇÃO! Devolvemos a variável que o sistema precisava.

                            // 1. Tenta identificar se as respostas vieram todas "grudadas" em uma coluna só
                            const matchFallback = line.replace(/[\t\s]+/g, '').match(/([A-E\*\-]{45})$/i);
                            if (matchFallback) {
                                respostasRaw = matchFallback[1].toUpperCase().replace(/-/g, '*');
                            } else {
                                // 2. Lógica Inteligente: Busca questão por questão pelos cabeçalhos ou posições fixas
                                let respostasGeradas = "";
                                for (let q = 1; q <= 45; q++) {
                                    let qKey = `Q${String(q).padStart(2, '0')}`;
                                    let fallbackIndex = 16 + (q - 1); 
                                    
                                    // Tenta puxar a resposta da coluna correta
                                    let respOriginal = getVal(colunas, qKey, fallbackIndex);
                                    
                                    // Sanitizador: limpa aspas, espaços e converte para maiúsculo
                                    let v = String(respOriginal || '*').replace(/["']/g, '').replace(/\s+/g, '').toUpperCase();
                                    
                                    // Regra de Correção: Se marcou duas, deixou em branco ou faltou coluna no final, vira '*'
                                    if (v.length !== 1 || !/^[A-E]$/.test(v)) {
                                        v = '*';
                                    }
                                    respostasGeradas += v;
                                }
                                respostasRaw = respostasGeradas;
                            }

                            // Trava de segurança para ignorar linhas vazias ou quebradas
                            if (!respostasRaw || respostasRaw.length !== 45) {
                                if (colunas.length >= 10) {
                                    respostasRaw = "*".repeat(45);
                                } else {
                                    errorCount++;
                                    continue;
                                }
                            }

                            const sexoInfo = getVal(colunas, 'SEXO', 4).trim().toUpperCase();
                            const pcdInfo = getVal(colunas, 'PCD', 5).trim().toUpperCase();
                            const autoInfo = getVal(colunas, 'AUTODECLARAÇÃO', 6).trim().toUpperCase();
                            const idadeInfo = getVal(colunas, 'IDADE', 7).trim().toUpperCase();
                            const edicInfo = getVal(colunas, 'EDIÇÃO', 8).trim().toUpperCase();
                            const discInfo = getVal(colunas, 'DISCIPLINA', 9).trim().toUpperCase();
                            const muniInfo = getVal(colunas, 'MUNICÍPIO', 10).trim().toUpperCase();
                            const modaInfo = getVal(colunas, 'MODALIDADE', 11).trim().toUpperCase();
                            const etapInfo = getVal(colunas, 'ETAPA', 12).trim().toUpperCase();
                            const turmInfo = getVal(colunas, 'TURMA', 13).trim().toUpperCase();
                            const cursInfo = getVal(colunas, 'CURSO', 14).trim().toUpperCase();
                            const turnInfo = getVal(colunas, 'TURNO', 15).trim().toUpperCase();
                            const avaliadoInfo = getVal(colunas, 'AVALIADO', 16).trim().toUpperCase();
                            const nomeInfo = getVal(colunas, 'ESTUDANTE', 3).trim().toUpperCase();
                            const matriculaInfo = getVal(colunas, 'MATRÍCULA', 2).trim().toUpperCase();

                            const restoUpper = restoLinha.toUpperCase();
                            let edicaoInfo = edicInfo !== '-' ? edicInfo.toUpperCase() : (restoUpper.includes('PRIMEIRA') ? 'PRIMEIRA' : (restoUpper.includes('SEGUNDA') ? 'SEGUNDA' : 'TERCEIRA'));
                            
                            let disciplinaInfo = 'LP';
                            const checkDisc = restoUpper.replace(/[\t\s]+/g, ''); 
                            if (checkDisc.includes('PRIMEIRAMT') || checkDisc.includes('SEGUNDAMT') || checkDisc.includes('TERCEIRAMT') || colunas.some(c => c.trim().toUpperCase() === 'MT' || c.trim().toUpperCase() === 'MATEMÁTICA')) {
                                disciplinaInfo = 'MT';
                            }

                            // Utiliza o gabarito dinâmico do Banco de Dados
                            const gabaritoOficial = dbSettings.gabaritos[edicaoInfo]?.[disciplinaInfo];
                            if(!gabaritoOficial) { errorCount++; continue; }

                            const respostasArray = respostasRaw.split('');
                            let acertos = 0;
                            const acertosPorQuestao = [];

                            respostasArray.forEach((resp, index) => {
                                const isCorrect = resp === gabaritoOficial[index];
                                if (isCorrect) acertos++;
                                acertosPorQuestao.push(isCorrect);
                            });

                            const aluno = {
                                rawInfo: colunas,
                                nome: nomeInfo,
                                matricula: matriculaInfo,
                                edicao: edicaoInfo,
                                disciplina: disciplinaInfo,
                                sexo: sexoInfo,
                                pcd: pcdInfo,
                                autodeclaracao: autoInfo,
                                idade: idadeInfo,
                                etapa: etapInfo,
                                turma: turmInfo,
                                turno: turnInfo,
                                curso: cursInfo,
                                modalidade: modaInfo,
                                avaliado: avaliadoInfo.toUpperCase().trim(),
                                respostasString: respostasRaw,
                                acertosTotal: acertos,
                                percentual: (acertos / 45) * 100,
                                acertosPorQuestao: acertosPorQuestao
                            };

                            results.push(aluno);
                            corrigidos.push(aluno);
                        }

                        if(results.length > 0) {
                            setParsedData(results);
                            setDadosCorrigidos(corrigidos);
                            setStatus({ message: '', type: '' });
                            setEtapa(3);
                            setHiddenTurmas([]); 
                            setHiddenEdicoesEvolucao([]);
                            setHiddenEdicoesEvolucaoEscola([]);
                            setHiddenLinhasHist([]);
                        } else {
                            setStatus({ message: `Nenhum dado válido. (${errorCount} linhas ignoradas, verifique o formato das respostas e disponibilidade dos gabaritos)`, type: 'warning' });
                        }
                    } catch (error) {
                        setStatus({ message: 'Erro no formato dos dados.', type: 'error' });
                    }
                    setIsProcessing(false);
                }, 500);
            };

            const clearData = () => { setInputText(''); setParsedData([]); setStatus({ message: '', type: '' }); };

            const limparFiltros = () => {
                setFEdicao('Todos'); setFEtapa('Todos'); setFTurma('Todos'); setFTurno('Todos'); 
                setFCurso('Todos'); setFModalidade('Todos'); setFSexo('Todos'); setFPcD('Todos'); 
                setFAutodeclaracao('Todos'); setFIdade('Todos');
                setHiddenTurmas([]); 
            };

            const toggleTurmaVisibility = (turma) => {
                setHiddenTurmas(prev => prev.includes(turma) ? prev.filter(t => t !== turma) : [...prev, turma]);
            };

            const toggleEdicaoVisibility = (ed) => {
                setHiddenEdicoesEvolucao(prev => prev.includes(ed) ? prev.filter(e => e !== ed) : [...prev, ed]);
            };

            const toggleEdicaoVisibilityEscola = (ed) => {
                setHiddenEdicoesEvolucaoEscola(prev => prev.includes(ed) ? prev.filter(e => e !== ed) : [...prev, ed]);
            };

            const getUnique = (field) => {
                const d = dadosCorrigidos.filter(i => i.disciplina === disciplinaAtiva);
                return [...new Set(d.map(i => i[field]).filter(v => v && v !== '-'))].sort();
            };

            // NOVA PENEIRA: Filtra tudo (Turma, Sexo, etc), MENOS a Edição para não quebrar os históricos
            const dadosFiltradosSemEdicao = useMemo(() => {
                return dadosCorrigidos.filter(d => {
                    if (d.avaliado === 'NÃO' || (d.avaliado && d.avaliado !== 'SIM' && d.avaliado !== 'S' && d.avaliado !== '-')) return false; 
                    if (d.disciplina !== disciplinaAtiva) return false;
                    if (fEtapa !== 'Todos' && d.etapa !== fEtapa) return false;
                    if (fTurma !== 'Todos' && d.turma !== fTurma) return false;
                    if (fTurno !== 'Todos' && d.turno !== fTurno) return false;
                    if (fCurso !== 'Todos' && d.curso !== fCurso) return false;
                    if (fModalidade !== 'Todos' && d.modalidade !== fModalidade) return false;
                    if (fSexo !== 'Todos' && d.sexo !== fSexo) return false;
                    if (fPcD !== 'Todos' && d.pcd !== fPcD) return false;
                    if (fAutodeclaracao !== 'Todos' && d.autodeclaracao !== fAutodeclaracao) return false;
                    if (fIdade !== 'Todos' && d.idade !== fIdade) return false;
                    return true;
                });
            }, [dadosCorrigidos, disciplinaAtiva, fEtapa, fTurma, fTurno, fCurso, fModalidade, fSexo, fPcD, fAutodeclaracao, fIdade]);

            const baseDataEdicoes = useMemo(() => {
                return dadosCorrigidos.filter(d => {
                    if (d.avaliado === 'NÃO' || (d.avaliado && d.avaliado !== 'SIM' && d.avaliado !== 'S' && d.avaliado !== '-')) return false; 
                    if (d.disciplina !== disciplinaAtiva) return false;
                    if (fEtapa !== 'Todos' && d.etapa !== fEtapa) return false;
                    if (fTurma !== 'Todos' && d.turma !== fTurma) return false;
                    if (fTurno !== 'Todos' && d.turno !== fTurno) return false;
                    if (fCurso !== 'Todos' && d.curso !== fCurso) return false;
                    if (fModalidade !== 'Todos' && d.modalidade !== fModalidade) return false;
                    if (fSexo !== 'Todos' && d.sexo !== fSexo) return false;
                    if (fPcD !== 'Todos' && d.pcd !== fPcD) return false;
                    if (fAutodeclaracao !== 'Todos' && d.autodeclaracao !== fAutodeclaracao) return false;
                    if (fIdade !== 'Todos' && d.idade !== fIdade) return false;
                    return true;
                });
            }, [dadosCorrigidos, disciplinaAtiva, fEtapa, fTurma, fTurno, fCurso, fModalidade, fSexo, fPcD, fAutodeclaracao, fIdade]);

            const stats = useMemo(() => {
                if(baseDataEdicoes.length === 0) return { total: 0, media: 0, mediana: 0, dp: 0, distribuicao: [0,0,0,0], acertosQuestao: [], statsPorEdicao: {}, edicoesPresentes: [], edicaoAtualStr: 'PRIMEIRA' };

                const edicoesPresentes = [...new Set(baseDataEdicoes.map(d => d.edicao))].sort((a, b) => {
                    const order = { 'PRIMEIRA': 1, 'SEGUNDA': 2, 'TERCEIRA': 3 };
                    return (order[a] || 99) - (order[b] || 99);
                });

                const edicaoAtualStr = fEdicao !== 'Todos' ? fEdicao : edicoesPresentes[edicoesPresentes.length - 1];

                const calcMetrics = (dataArray) => {
                    if (dataArray.length === 0) return { total: 0, media: '0.0', mediana: '0.0', dp: '0.0', distribuicao: [0,0,0,0] };
                    const notas = dataArray.map(d => d.percentual).sort((a, b) => a - b);
                    const media = notas.reduce((a,b)=>a+b, 0) / notas.length;
                    const mediana = notas.length % 2 === 0 ? (notas[notas.length/2 - 1] + notas[notas.length/2]) / 2 : notas[Math.floor(notas.length/2)];
                    const dp = Math.sqrt(notas.reduce((sq, n) => sq + Math.pow(n - media, 2), 0) / notas.length);

                    const dist = [0,0,0,0];
                    notas.forEach(n => {
                        if(n <= 25) dist[0]++;
                        else if(n <= 50) dist[1]++;
                        else if(n <= 75) dist[2]++;
                        else dist[3]++;
                    });
                    return { total: notas.length, media: media.toFixed(1), mediana: mediana.toFixed(1), dp: dp.toFixed(1), distribuicao: dist };
                };

                const statsPorEdicao = {};
                edicoesPresentes.forEach(ed => {
                    statsPorEdicao[ed] = calcMetrics(baseDataEdicoes.filter(d => d.edicao === ed));
                });

                const currentDataFiltered = fEdicao !== 'Todos' ? baseDataEdicoes.filter(d => d.edicao === fEdicao) : baseDataEdicoes;
                const statsGerais = calcMetrics(currentDataFiltered);

                const dataEdicaoAtual = baseDataEdicoes.filter(d => d.edicao === edicaoAtualStr);
                const aq = Array(45).fill(0);
                dataEdicaoAtual.forEach(aluno => {
                    aluno.acertosPorQuestao.forEach((acertou, i) => { if(acertou) aq[i]++; });
                });
                
                // Utiliza Matrizes e Gabaritos do Banco de Dados
                const matrizHab = dbSettings.matrizes[edicaoAtualStr]?.[disciplinaAtiva] || Array(45).fill('-');
                const gabaritoOficial = dbSettings.gabaritos[edicaoAtualStr]?.[disciplinaAtiva] || Array(45).fill('-');

                const acertosObj = aq.map((val, i) => {
                    const perc = dataEdicaoAtual.length > 0 ? (val / dataEdicaoAtual.length) * 100 : 0;
                    
                    let colorClass = '';
                    let agrupamento = '';
                    
                    if (perc <= 40) { colorClass = 'bg-red-500'; agrupamento = 'Baixo'; } 
                    else if (perc <= 60) { colorClass = 'bg-orange-500'; agrupamento = 'Médio Baixo'; } 
                    else if (perc <= 80) { colorClass = 'bg-green-500'; agrupamento = 'Médio Alto'; } 
                    else { colorClass = 'bg-blue-500'; agrupamento = 'Alto'; }

                    return {
                        id: i + 1,
                        label: `Q${String(i+1).padStart(2, '0')}`,
                        acertos: val,
                        percentual: perc,
                        habilidade: matrizHab[i],
                        descricao: dbSettings.habilidades[disciplinaAtiva]?.[matrizHab[i]] || '---',
                        gabarito: gabaritoOficial[i],
                        colorClass: colorClass,
                        agrupamento: agrupamento
                    }
                });

                return { ...statsGerais, acertosQuestao: acertosObj, statsPorEdicao, edicoesPresentes, edicaoAtualStr };
            }, [baseDataEdicoes, fEdicao, disciplinaAtiva, dbSettings]);



            // HABILIDADES: Cálculo Base
            const analiseHabilidades = useMemo(() => {
                if (!stats.edicaoAtualStr || baseDataEdicoes.length === 0) return null;
                const dataAtual = baseDataEdicoes.filter(d => d.edicao === stats.edicaoAtualStr);
                if (dataAtual.length === 0) return null;

                const matrizHab = dbSettings.matrizes[stats.edicaoAtualStr]?.[disciplinaAtiva] || [];

                const habMap = {};
                dataAtual.forEach(aluno => {
                    aluno.acertosPorQuestao.forEach((acertou, i) => {
                        const hab = matrizHab[i];
                        if (!hab || hab === '-') return;
                        if (!habMap[hab]) habMap[hab] = { total: 0, acertos: 0, questoes: new Set() };
                        habMap[hab].total++;
                        if (acertou) habMap[hab].acertos++;
                        habMap[hab].questoes.add(i);
                    });
                });

                const desempenhoGeral = Object.keys(habMap).map(hab => {
                    const perc = (habMap[hab].acertos / habMap[hab].total) * 100;
                    let colorClass = perc <= 40 ? 'bg-red-500' : perc <= 60 ? 'bg-orange-500' : perc <= 80 ? 'bg-green-500' : 'bg-blue-500';
                    return {
                        habilidade: hab,
                        descricao: dbSettings.habilidades[disciplinaAtiva]?.[hab] || '---',
                        percentual: perc,
                        colorClass: colorClass,
                        qtdQuestoes: habMap[hab].questoes.size,
                        questoesArray: Array.from(habMap[hab].questoes).sort((a,b) => a-b)
                    };
                });

                const turmasMap = {};
                dataAtual.forEach(aluno => {
                    const turmaKey = `${aluno.etapa} - ${aluno.turma}`;
                    if (!turmasMap[turmaKey]) turmasMap[turmaKey] = { alunos: [], habs: {} };
                    turmasMap[turmaKey].alunos.push(aluno);
                });

                const turmasLista = Object.keys(turmasMap).sort();
                const habsLista = desempenhoGeral.map(h => h.habilidade).sort();

                turmasLista.forEach(tKey => {
                    const alunosTurma = turmasMap[tKey].alunos;
                    const hMap = turmasMap[tKey].habs;
                    alunosTurma.forEach(aluno => {
                        aluno.acertosPorQuestao.forEach((acertou, i) => {
                            const hab = matrizHab[i];
                            if (!hab || hab === '-') return;
                            if (!hMap[hab]) hMap[hab] = { total: 0, acertos: 0 };
                            hMap[hab].total++;
                            if (acertou) hMap[hab].acertos++;
                        });
                    });
                    Object.keys(hMap).forEach(h => {
                        hMap[h].percentual = (hMap[h].acertos / hMap[h].total) * 100;
                    });
                });

                return { desempenhoGeral, turmasMap, turmasLista, habsLista };
            }, [baseDataEdicoes, stats.edicaoAtualStr, disciplinaAtiva, dbSettings]);

            // HABILIDADES: Ordenação e Filtro da Guia Geral
            const sortedHabGeral = useMemo(() => {
                if (!analiseHabilidades) return [];
                let arr = [...analiseHabilidades.desempenhoGeral];
                
                if (filtroAgrupamentoHabGeral !== 'Todos') {
                    arr = arr.filter(h => getAgrupamento(h.percentual) === filtroAgrupamentoHabGeral);
                }

                if(ordemHabGeral === 'crescente') {
                    arr.sort((a,b) => a.percentual - b.percentual);
                } else if(ordemHabGeral === 'decrescente') {
                    arr.sort((a,b) => b.percentual - a.percentual);
                } else {
                    arr.sort((a,b) => a.habilidade.localeCompare(b.habilidade));
                }
                return arr;
            }, [analiseHabilidades, ordemHabGeral, filtroAgrupamentoHabGeral]);

            // NOVO: Cálculo para Evolução da Escola
            const dadosEvolucaoEscola = useMemo(() => {
                if (stats.edicoesPresentes.length === 0) return null;

                const classData = baseDataEdicoes.filter(d => d.avaliado === 'SIM');

                const edicoesMap = {};
                const allHabsSet = new Set();

                stats.edicoesPresentes.forEach(ed => {
                    edicoesMap[ed] = { habs: {}, alunos: [] };
                    const alunosEd = classData.filter(d => d.edicao === ed);
                    const matrizHab = dbSettings.matrizes[ed]?.[disciplinaAtiva] || [];
                    
                    alunosEd.forEach(aluno => {
                        aluno.acertosPorQuestao.forEach((acertou, i) => {
                            const hab = matrizHab[i];
                            if (!hab || hab === '-') return;
                            allHabsSet.add(hab);
                            if (!edicoesMap[ed].habs[hab]) edicoesMap[ed].habs[hab] = { total: 0, acertos: 0 };
                            edicoesMap[ed].habs[hab].total++;
                            if (acertou) edicoesMap[ed].habs[hab].acertos++;
                        });
                    });

                    Object.keys(edicoesMap[ed].habs).forEach(hab => {
                        const hData = edicoesMap[ed].habs[hab];
                        hData.percentual = hData.total > 0 ? (hData.acertos / hData.total) * 100 : 0;
                    });
                });

                const habsArray = Array.from(allHabsSet);
                const visibleEdicoes = stats.edicoesPresentes.filter(e => !hiddenEdicoesEvolucaoEscola.includes(e));

                const habAverages = habsArray.map(hab => {
                    if (visibleEdicoes.length === 0) return { hab, avg: 0 };
                    let sum = 0;
                    let count = 0;
                    visibleEdicoes.forEach(ed => {
                        if (edicoesMap[ed].habs[hab]) {
                            sum += edicoesMap[ed].habs[hab].percentual;
                            count++;
                        }
                    });
                    return { hab, avg: count > 0 ? sum / count : 0 };
                });

                let filteredHabs = habAverages;
                if (filtroAgrupamentoEvolucaoEscola !== 'Todos') {
                    filteredHabs = filteredHabs.filter(item => getAgrupamento(item.avg) === filtroAgrupamentoEvolucaoEscola);
                }

                if (ordemEvolucaoEscola === 'crescente') {
                    filteredHabs.sort((a,b) => a.avg - b.avg);
                } else if (ordemEvolucaoEscola === 'decrescente') {
                    filteredHabs.sort((a,b) => b.avg - a.avg);
                } else {
                    filteredHabs.sort((a,b) => a.hab.localeCompare(b.hab));
                }

                const sortedHabsList = filteredHabs.map(item => item.hab);

                return { edicoesMap, sortedHabsList, edicoesLista: stats.edicoesPresentes };

            }, [baseDataEdicoes, stats.edicoesPresentes, disciplinaAtiva, dbSettings.matrizes, hiddenEdicoesEvolucaoEscola, filtroAgrupamentoEvolucaoEscola, ordemEvolucaoEscola]);

            const chunkedHabsEvolucaoEscola = useMemo(() => {
                if (!dadosEvolucaoEscola || !dadosEvolucaoEscola.sortedHabsList) return [];
                const chunks = [];
                for (let i = 0; i < dadosEvolucaoEscola.sortedHabsList.length; i += 12) {
                    chunks.push(dadosEvolucaoEscola.sortedHabsList.slice(i, i + 12));
                }
                return chunks;
            }, [dadosEvolucaoEscola]);
            
            // NOVO: Cálculo de Dificuldade (Divisão das 45 questões em 3 grupos)
            // LÓGICA MODIFICADA: Cálculo de Dificuldade Completo por Questão e Edição
            // LÓGICA MODIFICADA: Cálculo de Dificuldade Completo por Questão e Edição
            // LÓGICA ATUALIZADA: Processamento de Dificuldade, Filtros e Ordenação Customizada
            const analiseDificuldade = useMemo(() => {
                if (!dadosFiltradosSemEdicao || dadosFiltradosSemEdicao.length === 0) return null;
                
                const listaEdicoes = [...new Set(dadosFiltradosSemEdicao.map(d => d.edicao))].sort((a, b) => {
                    const order = { 'PRIMEIRA': 1, 'SEGUNDA': 2, 'TERCEIRA': 3 };
                    return (order[a] || 99) - (order[b] || 99);
                });

                const resultadoDificuldadeGeral = {};
                const mapaHabilidadesMétricas = {};

                listaEdicoes.forEach(ed => {
                    const estudantesEdicao = dadosFiltradosSemEdicao.filter(d => d.edicao === ed && d.avaliado === 'SIM');
                    if (estudantesEdicao.length === 0) return;

                    const contagemAcertos = Array(45).fill(0);
                    estudantesEdicao.forEach(aluno => {
                        aluno.acertosPorQuestao.forEach((acertou, i) => { if(acertou) contagemAcertos[i]++; });
                    });

                    const matrizHabilidadesEd = dbSettings.matrizes[ed]?.[disciplinaAtiva] || Array(45).fill('-');

                    const questoesMapeadas = contagemAcertos.map((totalAcertos, i) => {
                        const percentualAcerto = estudantesEdicao.length > 0 ? (totalAcertos / estudantesEdicao.length) * 100 : 0;
                        const numeroQuestao = i + 1;
                        const labelQuestao = `Q${String(numeroQuestao).padStart(2, '0')}`;
                        const codigoHabilidade = matrizHabilidadesEd[i];
                        const descHab = dbSettings.habilidades[disciplinaAtiva]?.[codigoHabilidade] || '---';

                        const dadosPlanilhaQuestoes = dbSettings.questoes.find(q => 
                            String(q['EDIÇÃO'] || q['EDICAO'] || '').toUpperCase().trim() === ed &&
                            String(q['DISCIPLINA'] || '').toUpperCase().trim() === disciplinaAtiva &&
                            String(q['QUESTÃO'] || q['QUESTAO'] || '').toUpperCase().trim() === labelQuestao
                        );

                        return {
                            id: numeroQuestao,
                            label: labelQuestao,
                            percentual: percentualAcerto,
                            habilidade: codigoHabilidade,
                            descricao: descHab, 
                            acertos: totalAcertos, 
                            linkQuestao: dadosPlanilhaQuestoes ? dadosPlanilhaQuestoes.LINK_QUESTAO : null,
                            linkGabarito: dadosPlanilhaQuestoes ? dadosPlanilhaQuestoes.LINK_GABARITO_COMENTADO : null
                        };
                    });

                    // Classificação base: Maior para menor acerto
                    const questoesOrdenadasParaCorte = [...questoesMapeadas].sort((a, b) => b.percentual - a.percentual);
                    
                    const grupoFaceis = questoesOrdenadasParaCorte.slice(0, 15).map(q => ({...q, colorClass: 'bg-blue-500', agrupamento: 'Fáceis'}));
                    const grupoMedias = questoesOrdenadasParaCorte.slice(15, 30).map(q => ({...q, colorClass: 'bg-orange-500', agrupamento: 'Médias'}));
                    const grupoDificeis = questoesOrdenadasParaCorte.slice(30, 45).map(q => ({...q, colorClass: 'bg-red-500', agrupamento: 'Difíceis'}));

                    const obterMediaGrupo = (arrayGrupo) => arrayGrupo.length > 0 ? (arrayGrupo.reduce((soma, q) => soma + q.percentual, 0) / arrayGrupo.length) : 0;

                    const todasQuestoesClassificadas = [...grupoFaceis, ...grupoMedias, ...grupoDificeis];

                    // Alimenta as métricas gerais de habilidades baseando-se estritamente na edição ativa nos filtros gerais
                    if (ed === stats.edicaoAtualStr) {
                        todasQuestoesClassificadas.forEach(q => {
                            if (q.habilidade && q.habilidade !== '-') {
                                if (!mapaHabilidadesMétricas[q.habilidade]) {
                                    mapaHabilidadesMétricas[q.habilidade] = { soma: 0, qtd: 0, descricao: q.descricao };
                                }
                                mapaHabilidadesMétricas[q.habilidade].soma += q.percentual;
                                mapaHabilidadesMétricas[q.habilidade].qtd++;
                            }
                        });
                    }

                    resultadoDificuldadeGeral[ed] = {
                        edicao: ed,
                        resumoAcertos: [
                            { label: 'Fáceis', percentual: obterMediaGrupo(grupoFaceis), color: 'bg-blue-500', hex: '#3b82f6', icon: '🟢', questoes: grupoFaceis },
                            { label: 'Médias', percentual: obterMediaGrupo(grupoMedias), color: 'bg-orange-500', hex: '#f97316', icon: '🟡', questoes: grupoMedias },
                            { label: 'Difíceis', percentual: obterMediaGrupo(grupoDificeis), color: 'bg-red-500', hex: '#ef4444', icon: '🔴', questoes: grupoDificeis }
                        ],
                        todasQuestoesOrdenadas: todasQuestoesClassificadas
                    };
                });

                // Geração e ordenação alfabética (fixa) das opções do seletor de habilidades
                const seletorOpcoesHabilidades = Object.keys(mapaHabilidadesMétricas).map(hab => {
                    const m = mapaHabilidadesMétricas[hab];
                    return {
                        habilidade: hab,
                        descricao: m.descricao,
                        percentualMédi: m.soma / m.qtd
                    };
                }).sort((a, b) => a.habilidade.localeCompare(b.habilidade));

                // Aplicação de filtros e ordenações específicas do gráfico/tabela de dificuldade
                let questoesVisualizacaoMapeadas = [];
                if (resultadoDificuldadeGeral[stats.edicaoAtualStr]) {
                    questoesVisualizacaoMapeadas = [...resultadoDificuldadeGeral[stats.edicaoAtualStr].todasQuestoesOrdenadas];
                    
                    if (filtroDifGrupo !== 'Todos') {
                        questoesVisualizacaoMapeadas = questoesVisualizacaoMapeadas.filter(q => q.agrupamento === filtroDifGrupo);
                    }

                    if (ordemDifTaxa === 'original') {
                        questoesVisualizacaoMapeadas.sort((a, b) => a.id - b.id);
                    } else if (ordemDifTaxa === 'habilidade') {
                        questoesVisualizacaoMapeadas.sort((a, b) => {
                            if (a.habilidade < b.habilidade) return -1;
                            if (a.habilidade > b.habilidade) return 1;
                            return a.id - b.id;
                        });
                    } else if (ordemDifTaxa === 'crescente') {
                        questoesVisualizacaoMapeadas.sort((a, b) => a.percentual - b.percentual);
                    } else if (ordemDifTaxa === 'decrescente') {
                        questoesVisualizacaoMapeadas.sort((a, b) => b.percentual - a.percentual);
                    }
                }

                return { 
                    dadosPorEdicao: resultadoDificuldadeGeral, 
                    listaHabilidadesMapeadas: seletorOpcoesHabilidades,
                    questoesFiltradasExibição: questoesVisualizacaoMapeadas
                };
            }, [dadosFiltradosSemEdicao, disciplinaAtiva, dbSettings, stats.edicaoAtualStr, filtroDifGrupo, ordemDifTaxa]);

            // LÓGICA ATUALIZADA: Mapeamento Histórico Contextual Cruzado por Edições
            const analiseContextual = useMemo(() => {
                if (!dadosFiltradosSemEdicao || dadosFiltradosSemEdicao.length === 0) return null;

                const edicoesLista = [...new Set(dadosFiltradosSemEdicao.map(d => d.edicao))].sort((a, b) => {
                    const order = { 'PRIMEIRA': 1, 'SEGUNDA': 2, 'TERCEIRA': 3 };
                    return (order[a] || 99) - (order[b] || 99);
                });

                const marcadores = ['sexo', 'idade', 'pcd', 'autodeclaracao'];
                const resultado = {};

                marcadores.forEach(marcador => {
                    const categoriasSet = new Set();
                    dadosFiltradosSemEdicao.filter(d => d.avaliado === 'SIM').forEach(aluno => {
                        let cat = String(aluno[marcador] || '').toUpperCase().trim();
                        if (!cat || cat === '-' || cat === 'NULO') cat = 'NÃO INFORMADO';
                        categoriasSet.add(cat);
                    });
                    const listaCategorias = Array.from(categoriasSet).sort();

                    const turmasMap = {};
                    listaCategorias.forEach(cat => {
                        turmasMap[cat] = { habs: {} };
                    });

                    edicoesLista.forEach(ed => {
                        const alunosEd = dadosFiltradosSemEdicao.filter(d => d.edicao === ed && d.avaliado === 'SIM');
                        
                        listaCategorias.forEach(cat => {
                            const alunosCat = alunosEd.filter(aluno => {
                                let c = String(aluno[marcador] || '').toUpperCase().trim();
                                if (!c || c === '-' || c === 'NULO') c = 'NÃO INFORMADO';
                                return c === cat;
                            });

                            if (alunosCat.length > 0) {
                                const media = alunosCat.reduce((sum, a) => sum + a.percentual, 0) / alunosCat.length;
                                turmasMap[cat].habs[ed] = { percentual: media, qtd: alunosCat.length };
                            }
                        });
                    });

                    resultado[marcador] = {
                        habs: edicoesLista,
                        turmas: listaCategorias,
                        turmasMap: turmasMap
                    };
                });

                return resultado;
            }, [dadosFiltradosSemEdicao, disciplinaAtiva]);

            // NOVO: Cálculo Histórico de Habilidades (SPAECE + SAME)
            const opcoesHistHab = useMemo(() => {
                const allHabsSet = new Set();
                
                if (dbSettings.spaece) {
                    dbSettings.spaece.forEach(d => {
                        const disc = String(d.DISCIPLINA || d.COMPONENTE || '').toUpperCase().trim();
                        const isLP = disciplinaAtiva === 'LP' && (disc === 'LP' || disc.includes('PORT') || disc.includes('LINGUA'));
                        const isMT = disciplinaAtiva === 'MT' && (disc === 'MT' || disc.includes('MAT'));
                        
                        if (isLP || isMT) {
                            const hab = String(d.HABILIDADE || d.HAB || '').toUpperCase().trim();
                            // Ignora valores vazios, traços ou indefinidos
                            if (hab && hab !== '-' && hab !== '---' && hab !== 'NULL' && hab.length > 1) {
                                allHabsSet.add(hab);
                            }
                        }
                    });
                }
                
                stats.edicoesPresentes.forEach(ed => {
                    const matriz = dbSettings.matrizes[ed]?.[disciplinaAtiva] || [];
                    matriz.forEach(h => { 
                        const habClean = String(h || '').toUpperCase().trim();
                        if(habClean && habClean !== '-' && habClean !== '---' && habClean !== 'NULL' && habClean.length > 1) {
                            allHabsSet.add(habClean); 
                        }
                    });
                });

                const options = Array.from(allHabsSet).map(hab => {
                    return { habilidade: hab, descricao: dbSettings.habilidades[disciplinaAtiva]?.[hab] || '---', percentual: 0 };
                });

                if (ordemSelectHistHab === 'alfabetica') {
                    options.sort((a, b) => a.habilidade.localeCompare(b.habilidade));
                } else if (ordemSelectHistHab === 'crescente') {
                    options.sort((a, b) => a.percentual - b.percentual);
                } else {
                    options.sort((a, b) => b.percentual - a.percentual);
                }
                return options;
            }, [dbSettings, stats.edicoesPresentes, disciplinaAtiva, ordemSelectHistHab]);

            useEffect(() => {
                if (opcoesHistHab && opcoesHistHab.length > 0) {
                    if (!habHistSel || !opcoesHistHab.find(h => h.habilidade === habHistSel)) {
                        setHabHistSel(opcoesHistHab[0].habilidade);
                    }
                }
            }, [opcoesHistHab, habHistSel]);

            const dadosHistoricoAdaptados = useMemo(() => {
                if (!habHistSel) return null;
                const modEscola = dadosFiltradosSemEdicao.find(d => d.avaliado === 'SIM')?.modalidade || '';
                const spaeceData = dbSettings.spaece || [];
                
                // Filtra os dados apenas para a disciplina ativa (LP ou MT)
                const spaeceFiltered = spaeceData.filter(d => 
                    String(d.DISCIPLINA || d.COMPONENTE || '').toUpperCase().trim() === disciplinaAtiva
                );

                // AJUSTE: Nova ordem (3ª série antes da 2ª série em 2025)
                const timeline = ['2023', '2024', '2025 (3ªS)', '2025 (2ªS)', 'PRIMEIRA', 'SEGUNDA', 'TERCEIRA'];
                
                // AJUSTE: Rótulos especificando SPAECE e SAME
                const labels = [
                    'SPAECE 2023', 
                    'SPAECE 2024', 
                    'SPAECE 2025 (3ª)', 
                    'SPAECE 2025 (2ª)', 
                    'SAME 1ªED', 
                    'SAME 2ªED', 
                    'SAME 3ªED'
                ];
                
                const turmasMap = {
                    'Média da Escola': { habs: {} },
                    'Média Regional': { habs: {} },
                    'Média Modalidade': { habs: {} }
                };

                const inferirModalidade = (nomeEscola) => {
                    const n = String(nomeEscola).toUpperCase();
                    if (n.includes('EEEP')) return 'PROFISSIONAL';
                    if (n.includes('EEMTI')) return 'INTEGRAL';
                    if (n.includes('EEM') || n.includes('EEFM')) return 'REGULAR';
                    return 'REGULAR';
                };
                const modSelLimpa = modEscola.toUpperCase().trim() || inferirModalidade(escolaSelecionada);

                timeline.forEach((period, idx) => {
                    const xLabel = labels[idx];
                    let valEscola = null; let valRegional = null; let valMod = null;

                    const parsePerc = (v) => {
                        if (v === undefined || v === null || v === '' || v === '-') return null;
                        let str = String(v).replace(',', '.').replace(/[^0-9.-]/g, '');
                        let num = parseFloat(str);
                        if (isNaN(num)) return null;
                        if (String(v).includes('%') || (num > 0 && num <= 1.0)) {
                            return num <= 1.0 ? num * 100 : num;
                        }
                        return num > 100 ? 100 : num; 
                    };

                    if (['2023', '2024', '2025 (3ªS)', '2025 (2ªS)'].includes(period)) {
                        let anoSerieKey = '';
                        if (period === '2023') anoSerieKey = '2023_3A';
                        if (period === '2024') anoSerieKey = '2024_3A';
                        if (period === '2025 (2ªS)') anoSerieKey = '2025_2A';
                        if (period === '2025 (3ªS)') anoSerieKey = '2025_3A';

                        const dataPeriod = spaeceFiltered.filter(d => String(d.ANO_SERIE || '').toUpperCase() === anoSerieKey);
                        const colKey = habHistSel.toUpperCase().split(' ')[0].trim();
                        
                        const validData = dataPeriod.map(d => {
                            const p = parsePerc(d[colKey]);
                            return { ...d, percVal: p, calcMod: inferirModalidade(d.ESCOLA) };
                        }).filter(d => d.percVal !== null);

                        const escSelLimpa = escolaSelecionada.toUpperCase().trim();
                        const recEscola = validData.filter(d => {
                            const nomeEsc = String(d.ESCOLA || '').toUpperCase().trim();
                            return nomeEsc === escSelLimpa || nomeEsc.includes(escSelLimpa) || escSelLimpa.includes(nomeEsc);
                        });
                        if (recEscola.length > 0) valEscola = recEscola.reduce((a,b)=>a+b.percVal, 0)/recEscola.length;
                        if (validData.length > 0) valRegional = validData.reduce((a,b)=>a+b.percVal, 0)/validData.length;
                        
                        const recMod = validData.filter(d => d.calcMod === modSelLimpa);
                        if (recMod.length > 0) valMod = recMod.reduce((a,b)=>a+b.percVal, 0)/recMod.length;

                    } else {
                        const ed = period;
                        const classData = dadosFiltradosSemEdicao.filter(d => d.avaliado === 'SIM' && d.edicao === ed);
                        const matriz = dbSettings.matrizes[ed]?.[disciplinaAtiva] || [];
                        const qIndices = [];
                        matriz.forEach((h, i) => { if (h === habHistSel) qIndices.push(i); });
                        
                        if (qIndices.length > 0 && classData.length > 0) {
                            let total = 0; let acertos = 0;
                            classData.forEach(aluno => {
                                qIndices.forEach(qIdx => {
                                    total++;
                                    if (aluno.acertosPorQuestao[qIdx]) acertos++;
                                });
                            });
                            if (total > 0) valEscola = (acertos / total) * 100;
                        }

                        const dataPeriod2026 = spaeceFiltered.filter(d => {
                            const ano = String(d.ANO_SERIE || '').toUpperCase().trim();
                            return ano.includes('2026') && (ano.includes(ed) || ano.includes(ed.substring(0,3)));
                        });
                        
                        const colKey = habHistSel.toUpperCase().split(' ')[0].trim();
                        const validData26 = dataPeriod2026.map(d => {
                            const p = parsePerc(d[colKey]);
                            return { ...d, percVal: p, calcMod: inferirModalidade(d.ESCOLA) };
                        }).filter(d => d.percVal !== null);

                        if (validData26.length > 0) valRegional = validData26.reduce((a,b)=>a+b.percVal, 0)/validData26.length;
                        const recMod2026 = validData26.filter(d => d.calcMod === modSelLimpa);
                        if (recMod2026.length > 0) valMod = recMod2026.reduce((a,b)=>a+b.percVal, 0)/recMod2026.length;
                    }

                    if (valEscola !== null) turmasMap['Média da Escola'].habs[xLabel] = { percentual: valEscola };
                    if (valRegional !== null) turmasMap['Média Regional'].habs[xLabel] = { percentual: valRegional };
                    if (valMod !== null) turmasMap['Média Modalidade'].habs[xLabel] = { percentual: valMod };
                });

                const colorMap = {
                    'Média da Escola': '#178a84',
                    'Média Regional': '#f97316',
                    'Média Modalidade': '#8b5cf6'
                };

                return {
                    habs: labels,
                    turmas: ['Média da Escola', 'Média Regional', 'Média Modalidade'],
                    turmasMap: turmasMap,
                    colorMap: colorMap
                };
            }, [habHistSel, dadosFiltradosSemEdicao, disciplinaAtiva, escolaSelecionada, dbSettings]);


            // CÁLCULO E CONSOLIDAÇÃO HISTÓRICA POR ESTUDANTE COM FILTRO DE EDIÇÃO E ORDENAÇÃO DINÂMICA
            const dadosAgrupadosEstudantes_AbaEst = useMemo(() => {
                if (!baseDataEdicoes || baseDataEdicoes.length === 0) return [];

                const mapaEstudantes = {};

                baseDataEdicoes.forEach(registro => {
                    const chaveUnica = `${registro.matricula}-${registro.nome}`.trim().toUpperCase();
                    if (!chaveUnica || chaveUnica === '-') return;

                    if (!mapaEstudantes[chaveUnica]) {
                        mapaEstudantes[chaveUnica] = {
                            nome: registro.nome,
                            matricula: registro.matricula,
                            sexo: registro.sexo,
                            idade: registro.idade,
                            etapa: registro.etapa,
                            turma: registro.turma,
                            turno: registro.turno,
                            curso: registro.curso,
                            historicoEdicoes: [],
                            totalAcertosAcumulados: 0,
                            totalQuestoesAcumuladas: 0
                        };
                    }

                    mapaEstudantes[chaveUnica].historicoEdicoes.push(registro);
                    mapaEstudantes[chaveUnica].totalAcertosAcumulados += (registro.acertosTotal || 0);
                    mapaEstudantes[chaveUnica].totalQuestoesAcumuladas += 45; 
                });

                const listaConsolidada = Object.values(mapaEstudantes).map(est => {
                    const percentualMedioGlobal = est.totalQuestoesAcumuladas > 0 
                        ? (est.totalAcertosAcumulados / est.totalQuestoesAcumuladas) * 100 
                        : 0;

                    // Localiza dados da edição selecionada no filtro para exibição condicional
                    const edicaoEspecifica = est.historicoEdicoes.find(ed => ed.edicao === fEdicao);

                    const controleHabilidades = {};
                    est.historicoEdicoes.forEach(ed => {
                        const edicaoStr = ed.edicao;
                        const matrizHabilidades = dbSettings.matrizes[edicaoStr]?.[disciplinaAtiva] || [];
                        const gabaritoOficial = dbSettings.gabaritos[edicaoStr]?.[disciplinaAtiva] || [];

                        matrizHabilidades.forEach((hab, idx) => {
                            if (!hab || hab === '-') return;
                            if (!controleHabilidades[hab]) {
                                controleHabilidades[hab] = { habilidade: hab, acertos: 0, total: 0 };
                            }
                            const respostaAluno = ed.respostasString?.[idx];
                            const respostaCorreta = gabaritoOficial[idx];
                            if (respostaAluno && respostaCorreta && String(respostaAluno).toUpperCase() === String(respostaCorreta).toUpperCase()) {
                                controleHabilidades[hab].acertos += 1;
                            }
                            controleHabilidades[hab].total += 1;
                        });
                    });

                    const listaHabilidades = Object.values(controleHabilidades).map(h => ({
                        ...h,
                        percentualSucesso: h.total > 0 ? (h.acertos / h.total) * 100 : 0,
                        descricao: dbSettings.habilidades[disciplinaAtiva]?.[h.habilidade] || 'Sem descrição'
                    }));

                    return {
                        ...est,
                        mediaPercentual: percentualMedioGlobal,
                        acertosEspecifico: edicaoEspecifica ? edicaoEspecifica.acertosTotal : null,
                        percentualEspecifico: edicaoEspecifica ? edicaoEspecifica.percentual : null,
                        topHabilidadesAcertos: [...listaHabilidades].sort((a, b) => b.percentualSucesso - a.percentualSucesso || b.total - a.total).slice(0, 10),
                        topHabilidadesErros: [...listaHabilidades].sort((a, b) => a.percentualSucesso - b.percentualSucesso || a.total - b.total).slice(0, 10)
                    };
                });

                let dadosFiltrados = listaConsolidada;

                // Aplica filtro da edição caso não esteja em 'Todos'
                if (fEdicao !== 'Todos') {
                    dadosFiltrados = dadosFiltrados.filter(e => e.historicoEdicoes.some(ed => ed.edicao === fEdicao));
                }

                if (buscaNomeEstudante_AbaEst.trim() !== '') {
                    const termoBusca = buscaNomeEstudante_AbaEst.toLowerCase();
                    dadosFiltrados = dadosFiltrados.filter(e => (e.nome || '').toLowerCase().includes(termoBusca));
                }

                // Chaves de ordenação estendidas para cliques nos cabeçalhos
                if (ordemListaEstudantes_AbaEst === 'alfa') {
                    dadosFiltrados.sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
                } else if (ordemListaEstudantes_AbaEst === 'alfa_desc') {
                    dadosFiltrados.sort((a, b) => (b.nome || '').localeCompare(a.nome || ''));
                } else if (ordemListaEstudantes_AbaEst === 'desc') {
                    dadosFiltrados.sort((a, b) => b.mediaPercentual - a.mediaPercentual);
                } else if (ordemListaEstudantes_AbaEst === 'asc') {
                    dadosFiltrados.sort((a, b) => a.mediaPercentual - b.mediaPercentual);
                } else if (ordemListaEstudantes_AbaEst === 'turma_asc') {
                    dadosFiltrados.sort((a, b) => (a.turma || '').localeCompare(b.turma || '') || (a.nome || '').localeCompare(b.nome || ''));
                } else if (ordemListaEstudantes_AbaEst === 'turma_desc') {
                    dadosFiltrados.sort((a, b) => (b.turma || '').localeCompare(a.turma || '') || (a.nome || '').localeCompare(b.nome || ''));
                } else if (ordemListaEstudantes_AbaEst === 'especifico_desc') {
                    dadosFiltrados.sort((a, b) => (b.percentualEspecifico ?? -1) - (a.percentualEspecifico ?? -1));
                } else if (ordemListaEstudantes_AbaEst === 'especifico_asc') {
                    dadosFiltrados.sort((a, b) => (a.percentualEspecifico ?? 101) - (b.percentualEspecifico ?? 101));
                }

                return dadosFiltrados;
            }, [baseDataEdicoes, buscaNomeEstudante_AbaEst, ordemListaEstudantes_AbaEst, dbSettings, disciplinaAtiva, fEdicao]);

            // PROCESSAMENTO DE MATERIAIS E TAXAS DE ACERTO POR ITEM (EXCLUSIVO DA GUIA MATERIAIS)
            const dadosMateriaisEQuestoes_AbaMat = useMemo(() => {
                // Caso nenhuma edição tenha sido selecionada pelo seletor interno, adota-se a mais recente
                const edicaoAlvo = edicaoSelecionada_AbaMat || stats.edicaoAtualStr || '';

                // 1. Filtragem dos materiais cadastrados na planilha vinculada
                const listaMateriais = (dbSettings.materiais || []).filter(m => 
                    String(m['DISCIPLINA']).toUpperCase() === String(disciplinaAtiva).toUpperCase() &&
                    String(m['EDIÇÃO']).toUpperCase() === String(edicaoAlvo).toUpperCase()
                );

                // 2. Recuperação da matriz estrutural e cálculo da taxa de acerto por item
                const alunosEdicao = baseDataEdicoes.filter(a => String(a.edicao).toUpperCase() === String(edicaoAlvo).toUpperCase());
                const totalAlunos = alunosEdicao.length;

                const matrizHabilidades = dbSettings.matrizes[edicaoAlvo]?.[disciplinaAtiva] || Array(45).fill('-');
                const gabaritoOficial = dbSettings.gabaritos[edicaoAlvo]?.[disciplinaAtiva] || Array(45).fill('-');

                let listaQuestoes = Array.from({ length: 45 }, (_, idx) => {
                    const numeroQuestao = idx + 1;
                    const labelQuestao = `Q${String(numeroQuestao).padStart(2, '0')}`;
                    const habCodigo = matrizHabilidades[idx] || '-';
                    const habDescricao = dbSettings.habilidades[disciplinaAtiva]?.[habCodigo] || 'Descrição não localizada na base';
                    const alternativaCorreta = gabaritoOficial[idx] || '-';

                    let totalAcertos = 0;
                    alunosEdicao.forEach(aluno => {
                        const respostaEstudante = aluno.respostasString?.[idx];
                        if (respostaEstudante && String(respostaEstudante).toUpperCase() === String(alternativaCorreta).toUpperCase()) {
                            totalAcertos++;
                        }
                    });

                    const percentualAcertoItem = totalAlunos > 0 ? (totalAcertos / totalAlunos) * 100 : 0;

                    // Vinculação com os caminhos das imagens (Aba QUESTÕES)
                    const metadadosItem = dbSettings.questoes?.find(q => 
                        String(q['EDIÇÃO']).toUpperCase() === String(edicaoAlvo).toUpperCase() &&
                        String(q['DISCIPLINA']).toUpperCase() === String(disciplinaAtiva).toUpperCase() &&
                        String(q['QUESTÃO']).toUpperCase() === labelQuestao
                    );

                    return {
                        id: idx,
                        numero: numeroQuestao,
                        label: labelQuestao,
                        habilidade: habCodigo,
                        descricao: habDescricao,
                        gabarito: alternativaCorreta,
                        taxaAcerto: percentualAcertoItem,
                        linkQuestao: metadadosItem ? metadadosItem['LINK_QUESTAO'] : null,
                        linkGabarito: metadadosItem ? metadadosItem['LINK_GABARITO_COMENTADO'] : null
                    };
                });

                // 3. Aplicação dos critérios de ordenação selecionados pelo usuário
                if (ordenacaoQuestoes_AbaMat === 'habilidade') {
                    listaQuestoes.sort((a, b) => a.habilidade.localeCompare(b.habilidade) || a.numero - b.numero);
                } else if (ordenacaoQuestoes_AbaMat === 'acerto_asc') {
                    listaQuestoes.sort((a, b) => a.taxaAcerto - b.taxaAcerto);
                } else if (ordenacaoQuestoes_AbaMat === 'acerto_desc') {
                    listaQuestoes.sort((a, b) => b.taxaAcerto - a.taxaAcerto);
                } else {
                    listaQuestoes.sort((a, b) => a.numero - b.numero);
                }

                return { listaMateriais, listaQuestoes, edicaoAlvo };
            }, [baseDataEdicoes, edicaoSelecionada_AbaMat, ordenacaoQuestoes_AbaMat, dbSettings, disciplinaAtiva, stats.edicaoAtualStr]);
            
            // MOTOR DE PROJEÇÃO DA ESCALA TRI E PADRÕES SPAECE (EXCLUSIVO DA GUIA SPAECE)
            const dadosSpaeceProjecao_AbaSpaece = useMemo(() => {
                if (!baseDataEdicoes || baseDataEdicoes.length === 0) return { filtrados: [], todosEstudantesLista: [] };

                const percCoerencia = (sliderCoerencia_AbaSpaece / 12) * 100;

                // Tabelas de Mapeamento TRI Estritas (Língua Portuguesa)
                const triLP = {
                    'Muito Crítico': [141.80, 144.92, 148.04, 151.16, 154.27, 157.39, 160.51, 163.63, 166.75, 169.87, 172.99, 176.10, 179.22, 182.34, 185.46, 188.58, 191.70, 194.81, 197.93, 201.05, 204.17, 207.29, 210.41, 213.53, 216.64, 219.76, 222.88],

                // Função de Projeção Unificada de Padrão e TRI
                const projetarPerfilEstudante = (disc, acertos) => {
                    const as = acertos === null || isNaN(acertos) ? 0 : acertos;
                    let padroesPossiveis = [];

                    if (disc === 'LP') {

                    } else {
                        if (as >= 0 && as <= 28) padroesPossiveis.push('Muito Crítico');
                        if (as >= 3 && as <= 32) padroesPossiveis.push('Crítico');

                    }
                    const proj = projetarPerfilEstudante(disciplinaAtiva, reg.acertosTotal);

                        proficiencia: proj.proficiencia,
                        corClasse: proj.corClasse,
                        turma: reg.turma,
                        etapa: reg.etapa
                    };
                });

                const todosEstudantesLista = Object.values(mapaLongitudinal).sort((a, b) => a.nome.localeCompare(b.nome));

                let dadosFiltrados = processados;

                    const t = buscaEstudante_AbaSpaece.toLowerCase();

            }, [baseDataEdicoes, sliderCoerencia_AbaSpaece, buscaEstudante_AbaSpaece, ordenacao_AbaSpaece, stats.edicaoAtualStr, disciplinaAtiva]);

            // MOTOR DE RESUMO E MÉDIA GERAL (DASHBOARD SPAECE)
            const resumoSpaece = useMemo(() => {
                if (!dadosSpaeceProjecao_AbaSpaece || !dadosSpaeceProjecao_AbaSpaece.filtrados || dadosSpaeceProjecao_AbaSpaece.filtrados.length === 0) return null;
                
                const filtrados = dadosSpaeceProjecao_AbaSpaece.filtrados;
                let counts = { 'Muito Crítico': 0, 'Crítico': 0, 'Intermediário': 0, 'Adequado': 0 };

                filtrados.forEach(f => {
                    if (counts[f.projPadrao] !== undefined) {
                        counts[f.projPadrao]++;
                    }
                    sumTri += f.projProficiencia;
                });

                const mediaTri = sumTri / filtrados.length;
                
                // Encontra o estudante que tem a nota mais próxima da média para "herdar" o Padrão e a Cor dele
                let closestStudent = filtrados[0];
                let minDiff = Infinity;
                filtrados.forEach(f => {
                    const diff = Math.abs(f.projProficiencia - mediaTri);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestStudent = f;
                    }
                });

                return {
                    counts,
                    mediaTri,
                    corClasse: closestStudent.projCor,
                    padrao: closestStudent.projPadrao
                };
            }, [dadosSpaeceProjecao_AbaSpaece]);
            
            // NOVO: Cálculo Comparativo entre edições do SAME
            const dadosComparativoEdicoes = useMemo(() => {
                if (baseDataEdicoes.length === 0 || !stats.edicoesPresentes || stats.edicoesPresentes.length < 2) return [];

                    const dataEd = baseDataEdicoes.filter(d => d.edicao === edicao);
                    if (dataEd.length === 0) return {};

                    dataEd.forEach(aluno => {

                            if (!hab || hab === '-') return;
                            if (!map[hab]) map[hab] = { total: 0, acertos: 0 };

                        });
                    });
                    const result = {};
                    Object.keys(map).forEach(h => {
                        result[h] = {
                            perc: (map[h].acertos / map[h].total) * 100,

                    'TERCEIRA': '3ª edição'

                allHabs.forEach(hab => {
                    if (habsAnt[hab] !== undefined && habsRec[hab] !== undefined) {

                        const absRec = habsRec[hab].acertos;
                        
                        const delta = percRec - percAnt;
                        const deltaAbs = absRec - absAnt;
                        
                        let colorClassPerc = delta > 0 ? 'bg-green-500' : delta < 0 ? 'bg-red-500' : 'bg-gray-400';
                        let colorClassAbs = deltaAbs > 0 ? 'bg-green-500' : deltaAbs < 0 ? 'bg-red-500' : 'bg-gray-400';

                        let percMid = null;

                            percMid,
                            absMid,
                            delta,

                            colorClassAbs,

                    }
                });

                if (ordemCompEdicoes === 'crescente') {
                    compArray.sort((a,b) => rotuloCompEdicoes === 'absoluto' ? a.deltaAbs - b.deltaAbs : a.delta - b.delta);

            // HABILIDADES: Ordenação e Filtro por Turma (Linhas)

            const chunkedHabs = useMemo(() => {

                const sortedHabsList = filteredHabs.map(item => item.hab);

                return { edicoesMap, sortedHabsList, edicoesLista: stats.edicoesPresentes };

            }, [turmaEvolucaoSel, dadosFiltradosSemEdicao, disciplinaAtiva, stats.edicoesPresentes, dbSettings.matrizes, hiddenEdicoesEvolucao, filtroAgrupamentoEvolucao, ordemEvolucao]);

                            const alunosEd = classData.filter(d => d.edicao === ed);
                            let total = 0;
                            let acertos = 0;
                            alunosEd.forEach(aluno => {
                                qIndices.forEach(qIdx => {
                                    total++;
                                    if (aluno.acertosPorQuestao[qIdx]) acertos++;
                                });
                            });
                            if (total > 0) {
                                sumPerc += (acertos / total) * 100;
                                countEd++;
                            }
                        }
                    });
                    
                    const media = countEd > 0 ? (sumPerc / countEd) : 0;
                    const descricao = dbSettings.habilidades[disciplinaAtiva]?.[hab] || 'Descrição não encontrada';
                    
                    return { habilidade: hab, descricao, percentual: media };
                });

                if (ordemSelectEvoHab === 'alfabetica') {
                    options.sort((a, b) => a.habilidade.localeCompare(b.habilidade));
                } else if (ordemSelectEvoHab === 'crescente') {
                    options.sort((a, b) => a.percentual - b.percentual);
                } else {
                    options.sort((a, b) => b.percentual - a.percentual);
                }

                return options;
            }, [turmaEvoHabSel, dadosFiltradosSemEdicao, disciplinaAtiva, stats.edicoesPresentes, dbSettings, ordemSelectEvoHab]);

            useEffect(() => {
                if (opcoesEvoHab && opcoesEvoHab.length > 0) {
                    if (!habEvoHabSel || !opcoesEvoHab.find(h => h.habilidade === habEvoHabSel)) {
                        setHabEvoHabSel(opcoesEvoHab[0].habilidade);
                    }
                }
            }, [opcoesEvoHab, habEvoHabSel]);

            const dadosEvoHab = useMemo(() => {
                if (!turmaEvoHabSel || !habEvoHabSel || stats.edicoesPresentes.length === 0) return null;
                
                const parts = turmaEvoHabSel.split('|');
                if (parts.length < 3) return null;
                const tEtapa = parts[0];
                const tTurma = parts[1];
                const tCurso = parts.slice(2).join('|'); 
                
                const classData = dadosFiltradosSemEdicao.filter(d => 
                    d.disciplina === disciplinaAtiva && 
                    d.etapa === tEtapa && 
                    d.turma === tTurma && 
                    d.curso === tCurso && 
                    d.avaliado === 'SIM'
                );

                let sumPerc = 0;
                let countEd = 0;
                const edicoesData = [];

                stats.edicoesPresentes.forEach(ed => {
                    const matriz = dbSettings.matrizes[ed]?.[disciplinaAtiva] || [];
                    const qIndices = [];
                    matriz.forEach((h, i) => { if (h === habEvoHabSel) qIndices.push(i); });

                    if (qIndices.length > 0) {
                        const alunosEd = classData.filter(d => d.edicao === ed);
                        let total = 0;
                        let acertos = 0;
                        
                        alunosEd.forEach(aluno => {
                            qIndices.forEach(qIdx => {
                                total++;
                                if (aluno.acertosPorQuestao[qIdx]) acertos++;
                            });
                        });

                        if (total > 0) {
                            const perc = (acertos / total) * 100;
                            sumPerc += perc;
                            countEd++;
                            
                            let colorClass = perc <= 40 ? 'bg-red-500' : perc <= 60 ? 'bg-orange-500' : perc <= 80 ? 'bg-green-500' : 'bg-blue-500';
                            
                            edicoesData.push({ edicao: ed, perc, acertos, total, colorClass, valid: true });
                        } else {
                            edicoesData.push({ edicao: ed, perc: 0, acertos: 0, total: 0, colorClass: 'bg-gray-300', valid: true });
                        }
                    } else {
                        edicoesData.push({ edicao: ed, perc: null, acertos: 0, total: 0, colorClass: 'bg-gray-300', valid: false });
                    }
                });

                const media = countEd > 0 ? (sumPerc / countEd) : 0;
                const descricao = dbSettings.habilidades[disciplinaAtiva]?.[habEvoHabSel] || 'Descrição não encontrada';

                return { currentHab: habEvoHabSel, edicoesData, media, descricao };

            }, [turmaEvoHabSel, habEvoHabSel, dadosFiltradosSemEdicao, disciplinaAtiva, stats.edicoesPresentes, dbSettings]);


            useEffect(() => {
                if (analiseHabilidades && analiseHabilidades.habsLista.length > 0) {
                    if (!habSelecionada || !analiseHabilidades.habsLista.includes(habSelecionada)) {
                        setHabSelecionada(analiseHabilidades.habsLista[0]);
                    }
                }
            }, [analiseHabilidades, habSelecionada]);

            const optionsDetalhe = useMemo(() => {
                if (!analiseHabilidades) return [];
                let arr = [...analiseHabilidades.desempenhoGeral];
                if (ordemSelectDetalhe === 'alfabetica') {
                    arr.sort((a, b) => a.habilidade.localeCompare(b.habilidade));
                } else if (ordemSelectDetalhe === 'crescente') {
                    arr.sort((a, b) => a.percentual - b.percentual);
                } else {
                    arr.sort((a, b) => b.percentual - a.percentual);
                }
                return arr;
            }, [analiseHabilidades, ordemSelectDetalhe]);

            const detalheHab = useMemo(() => {
                if (!analiseHabilidades || !habSelecionada || !analiseHabilidades.habsLista.includes(habSelecionada)) return null;
                const habObj = analiseHabilidades.desempenhoGeral.find(h => h.habilidade === habSelecionada);
                if (!habObj) return null;

                const questoesIdx = habObj.questoesArray;
                const matrizHab = dbSettings.matrizes[stats.edicaoAtualStr]?.[disciplinaAtiva] || [];
                
                const classesOverall = analiseHabilidades.turmasLista.map(tKey => ({
                    turma: tKey,
                    perc: analiseHabilidades.turmasMap[tKey].habs[habSelecionada]?.percentual || 0
                }));

                const qData = questoesIdx.map(qIdx => {
                    const label = `Q${String(qIdx+1).padStart(2, '0')}`;
                    const classScores = analiseHabilidades.turmasLista.map(tKey => {
                        const alunos = analiseHabilidades.turmasMap[tKey].alunos;
                        let acertos = 0;
                        let total = 0;
                        alunos.forEach(a => {
                            total++;
                            if(a.acertosPorQuestao[qIdx]) acertos++;
                        });
                        return { turma: tKey, perc: total > 0 ? (acertos/total)*100 : 0 };
                    });
                    
                    const desc = dbSettings.habilidades[disciplinaAtiva]?.[matrizHab[qIdx]] || '---';

                    return { qIdx, label, classScores, desc };
                });

                return { classesOverall, qData, descricao: habObj.descricao, percGeral: habObj.percentual };
            }, [analiseHabilidades, habSelecionada, stats.edicaoAtualStr, disciplinaAtiva, dbSettings]);

            const sortedTaxaAcertos = useMemo(() => {
                let arr = [...stats.acertosQuestao];
                if (filtroAgrupamento !== 'Todos') {
                    arr = arr.filter(q => q.agrupamento === filtroAgrupamento);
                }
                if(ordemTaxa === 'crescente') {
                    arr.sort((a,b) => a.percentual - b.percentual);
                } else if(ordemTaxa === 'decrescente') {
                    arr.sort((a,b) => b.percentual - a.percentual);
                } else if(ordemTaxa === 'habilidade') {
                    arr.sort((a,b) => {
                        if (a.habilidade < b.habilidade) return -1;
                        if (a.habilidade > b.habilidade) return 1;
                        return a.id - b.id;
                    });
                } else {
                    arr.sort((a,b) => a.id - b.id);
                }
                return arr;
            }, [stats.acertosQuestao, ordemTaxa, filtroAgrupamento]);

            const analiseDistribuicao = useMemo(() => {
                if(!stats.acertosQuestao || stats.acertosQuestao.length === 0) return '';
                const sorted = [...stats.acertosQuestao].sort((a,b) => b.percentual - a.percentual);
                const melhor = sorted[0];
                const pior = sorted[sorted.length - 1];
                return `A turma apresenta distribuição interessante de desempenho. A questão ${melhor.label} teve maior taxa de acerto (${melhor.percentual.toFixed(1)}%), indicando domínio dessa habilidade, enquanto a ${pior.label} apresentou a menor taxa (${pior.percentual.toFixed(1)}%). Recomenda-se trabalhar as habilidades relacionadas às questões com menor desempenho para aprimorar resultados em avaliações externas.`;
            }, [stats.acertosQuestao]);

            const renderCard = (title, field, suffix = '', bgClass = 'border-l-blue-500') => {
                if (fEdicao !== 'Todos' || !stats.edicoesPresentes || stats.edicoesPresentes.length <= 1) {
                    const val = fEdicao !== 'Todos' ? (stats.statsPorEdicao[fEdicao]?.[field] ?? 0) : (stats.statsPorEdicao[stats.edicoesPresentes?.[0]]?.[field] ?? 0);
                    return (
                        <div className={`bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-center border-l-4 ${bgClass}`}>
                            <h3 className="text-3xl font-black text-gray-800">{val}{suffix}</h3>
                            <p className="text-sm text-gray-500 font-medium mt-1">{title}</p>
                        </div>
                    );
                } else {
